services:

  # ==========================================================
  # SPRING BOOT
  # ==========================================================

  app:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: eco_skillfactory_c

    ports:
      - "8095:8095"

    environment:

      # ------------------------------------------------------
      # Spring Boot
      # ------------------------------------------------------

      SERVER_PORT: 8095

      # ------------------------------------------------------
      # MySQL
      # ------------------------------------------------------

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eco_skillfactory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # ------------------------------------------------------
      # JPA / Hibernate
      # ------------------------------------------------------

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_JPA_SHOW_SQL: "true"

      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      # ------------------------------------------------------
      # Upload Immagini e File
      # ------------------------------------------------------

      APP_UPLOAD_DIR: /app/uploads/

      # ------------------------------------------------------
      # SMTP Gmail
      # ------------------------------------------------------

      SPRING_MAIL_HOST: smtp.gmail.com

      SPRING_MAIL_PORT: 587

      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}

      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

    # --------------------------------------------------------
    # PERSISTENZA UPLOAD
    # --------------------------------------------------------

    volumes:

      - ./uploads:/app/uploads

    # --------------------------------------------------------
    # L'applicazione parte SOLO quando MySQL è HEALTHY
    # --------------------------------------------------------

    depends_on:

      mysql:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # MYSQL
  # ==========================================================

  mysql:

    image: mysql:8.4

    container_name: eco_skillfactory-mysql

    ports:
      - "3308:3306"

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: eco_skillfactory

    volumes:

      - mysql-data:/var/lib/mysql

    # --------------------------------------------------------
    # Controllo effettivo dello stato di MySQL
    # --------------------------------------------------------

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

    restart: unless-stopped


  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:

    image: phpmyadmin:latest

    container_name: eco_skillfactory-phpmyadmin

    ports:
      - "9003:80"

    environment:

      PMA_HOST: mysql

      PMA_PORT: 3306

      PMA_USER: root

      PMA_PASSWORD: root

    depends_on:

      mysql:
        condition: service_healthy

    restart: unless-stopped


# ============================================================
# VOLUMI
# ============================================================

volumes:

  mysql-data:
