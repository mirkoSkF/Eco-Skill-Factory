<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Eco Skill Factory</title>
    
    <!-- Bootstrap CSS & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .card-login {
            background: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 420px;">
    
    <!-- Card Principale -->
    <div class="card card-login p-4 p-sm-5">
        
        <!-- Header / Branding -->
        <div class="text-center mb-4">
            <div class="mb-3 text-primary">
                <i class="bi bi-shield-lock-fill display-4"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Eco Skill Factory</h3>
            <p class="text-muted small">Area riservata di Amministrazione</p>
        </div>

        <!-- Alert Errore Credenziali -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>Credenziali non valide. Riprova.</div>
        </div>

        <!-- Alert Logout Effettuato -->
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <div>Logout effettuato con successo.</div>
        </div>

        <!-- Form di Login -->
        <form th:action="@{/login}" method="post">
            
            <!-- Campo Username -->
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control border-start-0 ps-0" 
                           required 
                           autofocus 
                           placeholder="admin">
                </div>
            </div>

            <!-- Campo Password -->
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control border-start-0 ps-0" 
                           required 
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Botone di Invio -->
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Accedi alla Dashboard
            </button>
        </form>
        
        <!-- Link Torna alla Home -->
        <div class="text-center mt-4 pt-2 border-top">
            <a th:href="@{/}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Torna al sito principale
            </a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
