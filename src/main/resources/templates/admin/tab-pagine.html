<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Pagine Dinamiche - Eco Skill Factory</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP & ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-primary: #00dc82;
            --brand-primary-hover: #00b368;
            --brand-dark: #0f172a;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            background-color: #080c14;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* SFONDO CANVAS */
        #tech-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* LAYOUT MAIN & SIDEBAR LATERALE */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-nav {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2.5rem;
            width: calc(100% - var(--sidebar-width));
        }

        /* BRAND TEXT */
        .brand-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-accent {
            background: linear-gradient(135deg, #00dc82 0%, #36e4da 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* NAV LINKS SIDEBAR */
        .sidebar-menu .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 0.8rem 1.25rem;
            border-radius: 0.5rem;
            margin-bottom: 0.35rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            color: #00dc82 !important;
            background: rgba(0, 220, 130, 0.1);
            transform: translateX(4px);
        }

        .sidebar-menu .nav-link i {
            font-size: 1.15rem;
        }

        /* VETRO APPLICATO A CARD E TABELLE */
        .card-custom {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #f1f5f9;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .table-custom {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        .table-custom thead th {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #f8fafc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-weight: 600;
            padding: 1rem 0.75rem;
        }

        .table-custom tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        .table-custom tbody tr:hover {
            background: rgba(0, 220, 130, 0.04) !important;
        }

        .table-custom td {
            padding: 0.9rem 0.75rem;
            background: transparent !important;
            color: #cbd5e1;
        }

        /* BOTTONI CON STILE BRAND */
        .btn-brand {
            background: linear-gradient(135deg, #00dc82 0%, #00b368 100%);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 220, 130, 0.25);
        }

        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 220, 130, 0.4);
            color: #0f172a;
        }

        code {
            color: #36e4da;
            background: rgba(54, 228, 218, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Fira Code', monospace;
        }

        .empty-icon {
            font-size: 3rem;
            color: #475569;
        }

        /* INPUT CUSTOM DI RICERCA */
        .search-input-group .form-control {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
        }

        .search-input-group .form-control:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #00dc82;
            box-shadow: 0 0 0 0.25rem rgba(0, 220, 130, 0.15);
            color: #fff;
        }

        /* PAGINAZIONE STILE VETRO */
        .pagination .page-link {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 0.5rem 0.85rem;
        }

        .pagination .page-link:hover {
            background: rgba(0, 220, 130, 0.2);
            color: #00dc82;
            border-color: rgba(0, 220, 130, 0.3);
        }

        .pagination .page-item.active .page-link {
            background: #00dc82;
            border-color: #00dc82;
            color: #0f172a;
            font-weight: 700;
        }

        .pagination .page-item.disabled .page-link {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.05);
            color: #475569;
        }

        /* RESPONSIVE LATERALE */
        @media (max-width: 991.98px) {
            .sidebar-nav {
                position: relative;
                width: 100%;
                min-width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
            .admin-layout {
                flex-direction: column;
            }
            .main-wrapper {
                margin-left: 0;
                width: 100%;
                padding: 1.5rem;
            }
        }
    </style>

</head>

<body>

<!-- SFONDO ANIMATO -->
<canvas id="tech-bg-canvas"></canvas>

<div class="admin-layout">

    <!-- NAVBAR ADMIN LATERALE (SIDEBAR FRAGMENT) -->
    <div th:replace="~{fragments/sidebar :: sidebar('pages')}"></div>

    <!-- CONTENITORE PRINCIPALE -->
    <main class="main-wrapper">

        <!-- INTESTAZIONE SEZIONE -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="section-title mb-1 fw-bold text-white">
                    Pagine Dinamiche
                </h2>
                <p class="text-secondary mb-0">
                    Crea, cerca e gestisci le pagine del sito.
                </p>
            </div>

            <a th:href="@{/admin/pages/new}" class="btn btn-brand px-3 py-2">
                <i class="bi bi-file-earmark-plus me-1"></i>Crea Nuova Pagina
            </a>
        </div>

        <!-- FORM DI RICERCA IN TEMPO REALE -->
        <div class="card card-custom mb-4 p-3">
            <form id="searchForm" th:action="@{/admin/pages}" method="get" class="row g-2 align-items-center">
                <!-- Parametro per forzare massimo 10 righe per pagina -->
                <input type="hidden" name="size" value="10">

                <div class="col-md-8 col-lg-6">
                    <div class="input-group search-input-group">
                        <span class="input-group-text bg-transparent text-secondary border-secondary border-opacity-25">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="searchInput" name="search" th:value="${search}" class="form-control" placeholder="Cerca per slug o titolo pagina..." autocomplete="off">
                        <a th:if="${search != null and !#strings.isEmpty(search)}" th:href="@{/admin/pages(size=10)}" class="btn btn-outline-secondary" title="Azzera filtri">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <!-- TABELLA PAGINE -->
        <div class="card card-custom mb-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-custom align-middle">
                        <thead>
                            <tr>
                                <th>Titolo Pagina</th>
                                <th>Slug (URL)</th>
                                <th class="text-end" style="width: 250px;">Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pages}">
                                <td class="fw-semibold text-white"><span th:text="${p.title}">Chi Siamo</span></td>
                                <td><code th:text="'/p/' + ${p.slug}">/p/semo</code></td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{'/p/' + ${p.slug}}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-light me-1" title="Apri pagina">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/admin/pages/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info me-1" title="Modifica Pagina">
                                        <i class="bi bi-pencil me-1"></i>Modifica
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger" th:onclick="|showDeleteModal('@{/admin/pages/delete/{id}(id=${p.id})}')|" title="Elimina Pagina">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>

                            <tr th:if="${pages == null or #lists.isEmpty(pages)}">
                                <td colspan="5" class="text-center py-5 text-secondary">
                                    <i class="bi bi-folder-x empty-icon d-block mb-3"></i>
                                    <div class="fw-semibold mb-3 text-light">Nessuna pagina trovata.</div>
                                    <a th:href="@{/admin/pages/new}" class="btn btn-brand btn-sm">
                                        <i class="bi bi-plus-circle me-1"></i>Crea Nuova Pagina
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PAGINAZIONE (LIMITATA A MAX 10 ELEMENTI PER PAGINA) -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
            <div class="text-secondary small">
                Mostrando <span class="text-white fw-bold" th:text="${pages.size()}">0</span> di <span class="text-white fw-bold" th:text="${totalItems}">0</span> pagine complessive
            </div>

            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <!-- PRECEDENTE -->
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/pages(page=${currentPage - 1}, size=10, search=${search})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>

                    <!-- PAGINE NUMERATE -->
                    <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/pages(page=${i}, size=10, search=${search})}" th:text="${i}">1</a>
                    </li>

                    <!-- SUCCESSIVO -->
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/pages(page=${currentPage + 1}, size=10, search=${search})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

       

    </main>

</div>

<!-- MODAL DI CONFERMA ELIMINAZIONE -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-custom border-0">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title text-white"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Conferma Eliminazione</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-light">
                Sicuro di voler eliminare questa pagina?
            </div>
            <div class="modal-footer border-top border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger fw-bold">Elimina</a>
            </div>
        </div>
    </div>
</div>

<!-- BOOTSTRAP JS & SCRIPT ANIMAZIONE SFONDO -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showDeleteModal(url) {
        document.getElementById('confirmDeleteBtn').setAttribute('href', url);
        const modal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
        modal.show();
    }

    /* SCRIPT SFONDO ANIMATO */
    const canvas = document.getElementById('tech-bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Circuit {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.length = Math.floor(Math.random() * 8) + 4;
            this.currentStep = 0;
            this.dir = Math.floor(Math.random() * 4);
            this.path = [{ x: this.x, y: this.y }];
            this.speed = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.4 + 0.1;
            this.size = 20;
        }
        update() {
            if (this.currentStep < this.length) {
                let last = this.path[this.path.length - 1];
                let nx = last.x, ny = last.y;
                if (Math.random() < 0.3) {
                    this.dir = (this.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
                }
                switch (this.dir) {
                    case 0: ny -= this.size; break;
                    case 1: nx += this.size; break;
                    case 2: ny += this.size; break;
                    case 3: nx -= this.size; break;
                }
                this.path.push({ x: nx, y: ny });
                this.currentStep++;
            } else {
                this.alpha -= 0.005;
                if (this.alpha <= 0) this.reset();
            }
        }
        draw() {
            if (this.path.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(this.path[0].x, this.path[0].y);
            for (let i = 1; i < this.path.length; i++) {
                ctx.lineTo(this.path[i].x, this.path[i].y);
            }
            ctx.strokeStyle = `rgba(0, 220, 130, ${this.alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            let last = this.path[this.path.length - 1];
            ctx.beginPath();
            ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(54, 228, 218, ${this.alpha + 0.2})`;
            ctx.fill();
        }
    }

    const codeSnippets = [
        "class PageManager {}", "import spring.boot.*;", "<div class='eco'>",
        "SELECT * FROM pages;", "const init = () => {};", "return new Page();",
        "01000101 01000011 01001111", "public static void main()", "async fetch('/api')",
        "npm run build", "docker-compose up -d", "mvn clean install"
    ];

    class CodeText {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * (width - 200);
            this.y = Math.random() * height;
            this.text = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
            this.alpha = 0;
            this.maxAlpha = Math.random() * 0.3 + 0.1;
            this.fadeIn = true;
            this.speed = Math.random() * 0.3 + 0.1;
        }
        update() {
            this.y -= this.speed;
            if (this.fadeIn) {
                this.alpha += 0.008;
                if (this.alpha >= this.maxAlpha) this.fadeIn = false;
            } else {
                this.alpha -= 0.005;
                if (this.alpha <= 0) this.reset();
            }
        }
        draw() {
            ctx.font = '12px "Fira Code", monospace';
            ctx.fillStyle = `rgba(0, 220, 130, ${this.alpha})`;
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    const circuits = Array.from({ length: 18 }, () => new Circuit());
    const codeTexts = Array.from({ length: 12 }, () => new CodeText());

    function animate() {
        ctx.clearRect(0, 0, width, height);
        circuits.forEach(c => { c.update(); c.draw(); });
        codeTexts.forEach(ct => { ct.update(); ct.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    /* SCRIPT GESTIONE FILTRO IN TEMPO REALE */
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        if (!searchInput) return;

        // Mantiene il focus e posiziona il cursore in fondo al ricaricamento
        if (searchInput.value) {
            searchInput.focus();
            const val = searchInput.value;
            searchInput.value = '';
            searchInput.value = val;
        }

        let debounceTimer;
        searchInput.addEventListener('input', function () {
            const filter = this.value.toLowerCase().trim();
            const rows = document.querySelectorAll('.table-custom tbody tr');

            // 1. Filtro immediato in DOM per feedback istantaneo
            rows.forEach(row => {
                if (row.querySelector('.empty-icon')) return;
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });

            // 2. Invio automatico del form per interrogare il DB (debounce 500ms)
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                this.form.submit();
            }, 500);
        });
    });
</script>

</body>
</html>
