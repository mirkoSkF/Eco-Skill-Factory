<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Eco Skill Factory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .card-login {
            background: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container" style="max-width: 420px;">
    <div class="card card-login p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Eco Skill Factory</h3>
            <p class="text-muted small">Area di Amministrazione</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
            Credenziali non valide. Riprova.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
            Logout effettuato con successo.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold small">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="admin">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold small">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Accedi alla Dashboard</button>
        </form>
    </div>
</div>

</body>
</html>
