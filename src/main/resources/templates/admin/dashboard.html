<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Eco Skill Factory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">Eco Skill Factory - CMS</a>
        <div class="d-flex">
            <a href="/" target="_blank" class="btn btn-outline-light btn-sm me-2">Vedi Sito <i class="bi bi-box-arrow-up-right"></i></a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestione Righe Home Page</h2>
        <a th:href="@{/admin/block/new}" class="btn btn-success fw-bold">
            <i class="bi bi-plus-circle"></i> Aggiungi Nuova Riga
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 80px;">Posizione</th>
                        <th>ID</th>
                        <th>Titolo Amministrativo</th>
                        <th>Tipo Blocco</th>
                        <th>Larghezza</th>
                        <th>Altezza Min.</th>
                        <th class="text-end" style="width: 200px;">Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${blocks}">
                        <td class="fw-bold text-center" th:text="${b.position}">1</td>
                        <td th:text="${b.id}">1</td>
                        <td class="fw-semibold" th:text="${b.titleAdmin}">Header Principale</td>
                        <td>
                            <span class="badge bg-primary" th:text="${b.blockType.label}">Jumbotron</span>
                        </td>
                        <td th:text="${b.containerType.name()}">CONTAINER</td>
                        <td th:text="${b.customHeight}">auto</td>
                        <td class="text-end">
                            <a th:href="@{/admin/block/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i> Modifica
                            </a>
                            <a th:href="@{/admin/block/delete/{id}(id=${b.id})}" 
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Sicuro di voler eliminare questa riga?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(blocks)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            Nessuna riga presente. Clicca su "Aggiungi Nuova Riga" per iniziare.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
