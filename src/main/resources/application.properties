spring.application.name=eco-skillfactory

# Configurazione MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eco_skillfactory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Upload Immagini e File
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Percorso Cartella Upload (custom)
# Su Windows user\uFFFD la cartella 'uploads' relativa alla radice del progetto
# Su Ubuntu ti baster\uFFFD cambiare questa riga se vorrai usare una cartella dedicata (es. /var/www/uploads/)
app.upload.dir=uploads/

# Porta Server
server.port=8095

# Server SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mirko.onorato@gmail.com
spring.mail.password=qetq uxfq uqpc opuc

# Autenticazione e sicurezza
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true