<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Navbar - Eco Skill Factory</title>
    
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP & ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-primary: #00dc82;
            --brand-primary-hover: #00b368;
            --brand-dark: #0f172a;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            background-color: #080c14;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        #tech-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-nav {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2.5rem;
            width: calc(100% - var(--sidebar-width));
        }

        .brand-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-accent {
            background: linear-gradient(135deg, #00dc82 0%, #36e4da 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-menu .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 0.8rem 1.25rem;
            border-radius: 0.5rem;
            margin-bottom: 0.35rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            color: #00dc82 !important;
            background: rgba(0, 220, 130, 0.1);
            transform: translateX(4px);
        }

        .card-custom {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #f1f5f9;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-custom .card-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .table-custom {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        .table-custom thead th {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #f8fafc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-weight: 600;
            padding: 1rem 0.75rem;
        }

        .table-custom tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        .table-custom tbody tr:hover {
            background: rgba(0, 220, 130, 0.04) !important;
        }

        .table-custom td {
            padding: 0.9rem 0.75rem;
            background: transparent !important;
            color: #cbd5e1;
        }

        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            border-radius: 0.5rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(15, 23, 42, 0.95);
            border-color: #00dc82;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(0, 220, 130, 0.25);
        }

        .btn-brand {
            background: linear-gradient(135deg, #00dc82 0%, #00b368 100%);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 220, 130, 0.25);
        }

        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 220, 130, 0.4);
            color: #0f172a;
        }

        @media (max-width: 991.98px) {
            .sidebar-nav {
                position: relative;
                width: 100%;
                min-width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
            .admin-layout {
                flex-direction: column;
            }
            .main-wrapper {
                margin-left: 0;
                width: 100%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<canvas id="tech-bg-canvas"></canvas>

<div class="admin-layout">

    <!-- NAVBAR LATERALE -->
    <aside class="sidebar-nav p-3">
        <a class="navbar-brand fw-extrabold fs-5 d-flex align-items-center gap-2 mb-4 px-2 py-2" href="#">
            <i class="bi bi-cpu-fill text-success fs-3"></i>
            <div>
                <span class="brand-text fw-bold">Eco</span>
                <span class="brand-accent fw-bold">Skill</span>
                <div class="small text-uppercase text-secondary fs-6 tracking-wider">CMS Admin</div>
            </div>
        </a>

        <div class="sidebar-menu flex-grow-1">
            <a class="nav-link" th:href="@{/admin/dashboard}">
                <i class="bi bi-layers-half me-2"></i>Righe Home Page
            </a>
            <a class="nav-link active" th:href="@{/admin/navbar}">
                <i class="bi bi-menu-button-wide me-2"></i>Gestione Navbar
            </a>
        </div>

        <div class="pt-3 border-top border-secondary border-opacity-25 d-flex flex-column gap-2">
            <a href="/" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light btn-sm w-100 rounded-3 text-start">
                <i class="bi bi-eye me-2"></i>Vedi Sito <i class="bi bi-box-arrow-up-right ms-auto float-end"></i>
            </a>
            <a href="/logout" class="btn btn-danger btn-sm w-100 rounded-3 text-start bg-opacity-75">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <h2 class="mb-4 fw-bold text-white">Gestione Voci di Navigazione</h2>

        <div class="row g-4">
            <!-- FORM CREAZIONE/MODIFICA -->
            <div class="col-lg-5">
                <div class="card card-custom">
                    <div class="card-header fw-bold text-white fs-5 py-3">
                        <i class="bi me-2 text-success" th:classappend="${newItem.id != null} ? 'bi-pencil-square' : 'bi-plus-square'"></i>
                        <span th:text="${newItem.id != null} ? 'Modifica Voce' : 'Aggiungi Nuova Voce'">Aggiungi / Modifica Voce</span>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/navbar/save}" th:object="${newItem}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold text-light">Etichetta Menu (Label)</label>
                                <input type="text" class="form-control" th:field="*{label}" placeholder="es. Chi Siamo" required />
                            </div>

                            <!-- SELETTORE TIPO LINK -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-light">Tipo di Link</label>
                                <select id="linkTypeSelect" class="form-select" onchange="toggleLinkInput()">
                                    <option value="PAGE" th:selected="${newItem.page != null || (newItem.url == null || #strings.isEmpty(newItem.url))}">Pagina CMS</option>
                                    <option value="URL" th:selected="${newItem.url != null and !#strings.isEmpty(newItem.url)}">URL Personalizzato</option>
                                </select>
                            </div>

                            <!-- SELEZIONE PAGINA CMS -->
                            <div class="mb-3" id="pageSelectGroup">
                                <label class="form-label fw-bold text-light">Pagina Collegata</label>
                                <select id="pageSelect" class="form-select" th:field="*{page}">
                                    <option value="">-- Nessuna (Menu Categoria / Dropdown) --</option>
                                    <option th:each="p : ${pages}" th:value="${p.id}" th:text="${p.title}"></option>
                                </select>
                            </div>

                            <!-- INPUT URL PERSONALIZZATO -->
                            <div class="mb-3 d-none" id="urlInputGroup">
                                <label class="form-label fw-bold text-light">URL Personalizzato</label>
                                <input type="text" id="urlInput" class="form-control" th:field="*{url}" placeholder="https://google.com o /contatti" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-light">Menu Padre (Per Dropdown)</label>
                                <select class="form-select" th:field="*{parent}">
                                    <option value="">-- Nessuno (Voce Principale) --</option>
                                    <!-- Evita di impostare se stesso come padre in fase di modifica -->
                                    <option th:each="parentItem : ${navItems}" 
                                            th:if="${newItem.id == null || newItem.id != parentItem.id}"
                                            th:value="${parentItem.id}" 
                                            th:text="${parentItem.label}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-light">Ordine di Visualizzazione</label>
                                <input type="number" class="form-control" th:field="*{itemOrder}" required />
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-brand flex-grow-1 py-2">
                                    <i class="bi bi-save me-1"></i> Salva
                                </button>
                                <a th:if="${newItem.id != null}" th:href="@{/admin/navbar}" class="btn btn-outline-secondary py-2">
                                    Annulla
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABELLA VOCE E SOTTOVOCI -->
            <div class="col-lg-7">
                <div class="card card-custom">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-custom align-middle">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 70px;">Ordine</th>
                                        <th>Etichetta</th>
                                        <th>Tipo / Destinazione</th>
                                        <th class="text-end" style="width: 110px;">Azioni</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <th:block th:each="item : ${navItems}">
                                        <tr th:classappend="${newItem.id != null and newItem.id == item.id} ? 'table-active' : ''">
                                            <td class="fw-bold text-center text-success" th:text="${item.itemOrder}">1</td>
                                            <td class="fw-semibold text-white" th:text="${item.label}">Home</td>
                                            <td>
                                                <span th:if="${(item.children != null and !item.children.isEmpty()) or (item.page == null and (item.url == null or #strings.isEmpty(item.url)))}" 
                                                      class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-25">Dropdown</span>
                                                <a th:if="${item.page != null}" 
                                                   th:href="@{'/p/' + ${item.page.slug}}" 
                                                   target="_blank" 
                                                   class="badge bg-info bg-opacity-25 text-info border border-info border-opacity-25 text-decoration-none">
                                                    <i class="bi bi-box-arrow-up-right me-1"></i>/p/[[${item.page.slug}]]
                                                </a>
                                                <a th:if="${item.url != null and !#strings.isEmpty(item.url)}" 
                                                   th:href="${item.url}" 
                                                   target="_blank" 
                                                   class="badge bg-secondary bg-opacity-50 text-light border border-secondary border-opacity-25 text-decoration-none">
                                                    <i class="bi bi-box-arrow-up-right me-1"></i>[[${item.url}]]
                                                </a>
                                            </td>
                                            <td class="text-end">
                                                <div class="btn-group btn-group-sm">
                                                    <!-- PULSANTE MODIFICA PADRE -->
                                                    <a th:href="@{/admin/navbar/edit/{id}(id=${item.id})}" class="btn btn-outline-warning" title="Modifica">
                                                        <i class="bi bi-pencil-square"></i>
                                                    </a>
                                                    <!-- PULSANTE ELIMINA PADRE -->
                                                    <a th:href="@{/admin/navbar/delete/{id}(id=${item.id})}" class="btn btn-outline-danger" onclick="return confirm('Eliminare questa voce e le sue sottovoci?');" title="Elimina">
                                                        <i class="bi bi-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        <!-- SOTTOVOCI DROPDOWN -->
                                        <tr th:each="child : ${item.children}" th:classappend="${newItem.id != null and newItem.id == child.id} ? 'table-active' : ''">
                                            <td class="text-center text-secondary ps-4">└ <span th:text="${child.itemOrder}">1</span></td>
                                            <td class="ps-4 text-secondary" th:text="${child.label}">Sottovoce</td>
                                            <td>
                                                <a th:if="${child.page != null}" 
                                                   th:href="@{'/p/' + ${child.page.slug}}" 
                                                   target="_blank" 
                                                   class="badge bg-info bg-opacity-25 text-info border border-info border-opacity-25 text-decoration-none">
                                                    <i class="bi bi-box-arrow-up-right me-1"></i>/p/[[${child.page.slug}]]
                                                </a>
                                                <a th:if="${child.url != null and !#strings.isEmpty(child.url)}" 
                                                   th:href="${child.url}" 
                                                   target="_blank" 
                                                   class="badge bg-secondary bg-opacity-50 text-light border border-secondary border-opacity-25 text-decoration-none">
                                                    <i class="bi bi-box-arrow-up-right me-1"></i>[[${child.url}]]
                                                </a>
                                            </td>
                                            <td class="text-end">
                                                <div class="btn-group btn-group-sm">
                                                    <!-- PULSANTE MODIFICA FIGLIO -->
                                                    <a th:href="@{/admin/navbar/edit/{id}(id=${child.id})}" class="btn btn-outline-warning" title="Modifica">
                                                        <i class="bi bi-pencil-square"></i>
                                                    </a>
                                                    <!-- PULSANTE ELIMINA FIGLIO -->
                                                    <a th:href="@{/admin/navbar/delete/{id}(id=${child.id})}" class="btn btn-outline-danger" onclick="return confirm('Eliminare questa sottovoce?');" title="Elimina">
                                                        <i class="bi bi-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    </th:block>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- JAVASCRIPT DINAMICO LOGICA -->
<script>
function toggleLinkInput() {
    const linkType = document.getElementById('linkTypeSelect').value;
    const pageGroup = document.getElementById('pageSelectGroup');
    const urlGroup = document.getElementById('urlInputGroup');
    const pageSelect = document.getElementById('pageSelect');
    const urlInput = document.getElementById('urlInput');

    if (linkType === 'PAGE') {
        pageGroup.classList.remove('d-none');
        urlGroup.classList.add('d-none');
    } else {
        urlGroup.classList.remove('d-none');
        pageGroup.classList.add('d-none');
    }
}

document.addEventListener('DOMContentLoaded', toggleLinkInput);
</script>

<!-- CANVAS ANIMATO -->
<script>
    const canvas = document.getElementById('tech-bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Circuit {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.length = Math.floor(Math.random() * 8) + 4;
            this.currentStep = 0;
            this.dir = Math.floor(Math.random() * 4);
            this.path = [{ x: this.x, y: this.y }];
            this.speed = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.4 + 0.1;
            this.size = 20;
        }
        update() {
            if (this.currentStep < this.length) {
                let last = this.path[this.path.length - 1];
                let nx = last.x, ny = last.y;
                if (Math.random() < 0.3) {
                    this.dir = (this.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
                }
                switch (this.dir) {
                    case 0: ny -= this.size; break;
                    case 1: nx += this.size; break;
                    case 2: ny += this.size; break;
                    case 3: nx -= this.size; break;
                }
                this.path.push({ x: nx, y: ny });
                this.currentStep++;
            } else {
                this.alpha -= 0.005;
                if (this.alpha <= 0) this.reset();
            }
        }
        draw() {
            if (this.path.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(this.path[0].x, this.path[0].y);
            for (let i = 1; i < this.path.length; i++) {
                ctx.lineTo(this.path[i].x, this.path[i].y);
            }
            ctx.strokeStyle = `rgba(0, 220, 130, ${this.alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            let last = this.path[this.path.length - 1];
            ctx.beginPath();
            ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(54, 228, 218, ${this.alpha + 0.2})`;
            ctx.fill();
        }
    }

    const codeSnippets = [
        "class BlockManager {}", "import spring.boot.*;", "<div class='eco'>",
        "SELECT * FROM blocks;", "const init = () => {};", "return new PageBlock();",
        "01000101 01000011 01001111", "public static void main()", "async fetch('/api')",
        "npm run build", "docker-compose up -d", "mvn clean install"
    ];

    class CodeText {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * (width - 200);
            this.y = Math.random() * height;
            this.text = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
            this.alpha = 0;
            this.maxAlpha = Math.random() * 0.3 + 0.1;
            this.fadeIn = true;
            this.speed = Math.random() * 0.3 + 0.1;
        }
        update() {
            this.y -= this.speed;
            if (this.fadeIn) {
                this.alpha += 0.008;
                if (this.alpha >= this.maxAlpha) this.fadeIn = false;
            } else {
                this.alpha -= 0.005;
                if (this.alpha <= 0) this.reset();
            }
        }
        draw() {
            ctx.font = '12px "Fira Code", monospace';
            ctx.fillStyle = `rgba(0, 220, 130, ${this.alpha})`;
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    const circuits = Array.from({ length: 18 }, () => new Circuit());
    const codeTexts = Array.from({ length: 12 }, () => new CodeText());

    function animate() {
        ctx.clearRect(0, 0, width, height);
        circuits.forEach(c => { c.update(); c.draw(); });
        codeTexts.forEach(ct => { ct.update(); ct.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
