<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- ============================================================
         CSS ESCLUSIVO MONACO
         ============================================================ -->
    <th:block th:fragment="monaco-css">

        <style>

            .monaco-open-button {
                border-color: #36e4da !important;
                color: #36e4da !important;
                font-weight: 600;
            }

            .monaco-open-button:hover {
                background: rgba(54, 228, 218, .12) !important;
                color: #fff !important;
            }

            .monaco-editor-workspace {
                width: 100%;
                overflow: hidden;
                background: #1e1e1e;
            }

            .monaco-extra-toolbar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px;
                background: #111827;
                border-bottom: 1px solid #334155;
                flex-wrap: wrap;
                position: relative;
                z-index: 20;
            }

            .monaco-search-wrapper {
                flex: 1 1 320px;
                min-width: 260px;
                max-width: 700px;
                position: relative;
            }

            .monaco-search-input {
                font-family: 'Fira Code', monospace;
            }

            .monaco-search-results {
                position: absolute;
                top: calc(100% + 4px);
                right: 0;
                display: none;
                align-items: center;
                gap: 6px;
                padding: 4px 6px;
                border: 1px solid #475569;
                border-radius: 6px;
                background: #0f172a;
                box-shadow: 0 8px 20px rgba(0, 0, 0, .45);
                z-index: 1000;
                white-space: nowrap;
            }

            .monaco-search-results.visible {
                display: flex;
            }

            .monaco-search-count {
                min-width: 58px;
                text-align: center;
                color: #cbd5e1;
                font: 12px 'Fira Code', monospace;
            }

            .monaco-zoom-label {
                min-width: 58px;
                text-align: center;
                cursor: default;
            }

            .monaco-modal-editor-button {
                margin-bottom: 8px;
            }

            .monaco-editor .suggest-widget {
                z-index: 10000 !important;
            }

            /* ============================================================
               NAVIGAZIONE RISULTATI MONACO
               ============================================================ */

            .monaco-search-results.visible {
                display: flex !important;
            }

            .monaco-search-results button {
                min-width: 34px;
                height: 30px;
                padding: 2px 8px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                font-weight: 700;
                line-height: 1;
                cursor: pointer !important;
                pointer-events: auto !important;
            }

            .monaco-search-results button:hover {
                background: #334155 !important;
                border-color: #36e4da !important;
                color: #ffffff !important;
            }

            .monaco-search-match {
                background: rgba(255, 215, 0, .28);
                border: 1px solid rgba(255, 215, 0, .55);
                border-radius: 2px;
            }

            .monaco-search-match-current {
                background: rgba(0, 220, 130, .42);
                border: 1px solid rgba(0, 220, 130, .9);
                border-radius: 2px;
            }

            /* Stato di caricamento */
            .monaco-loading-overlay {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 12px;
                background: rgba(15, 23, 42, 0.94);
                z-index: 100;
            }

            .monaco-loading-overlay.visible {
                display: flex;
            }

            .monaco-loading-spinner {
                width: 38px;
                height: 38px;
                border: 3px solid rgba(255, 255, 255, 0.2);
                border-top-color: #36e4da;
                border-radius: 50%;
                animation: monacoLoadingSpin .8s linear infinite;
            }

            @keyframes monacoLoadingSpin {
                to {
                    transform: rotate(360deg);
                }
            }

        </style>

    </th:block>

</head>

<body>

    <!-- ============================================================
         MODALE MONACO
         La struttura viene caricata insieme alla pagina,
         ma la libreria Monaco NON viene caricata qui.
         ============================================================ -->
    <div class="modal fade"
         id="monacoEditorModal"
         tabindex="-1"
         aria-hidden="true"
         th:fragment="monaco-modal">

        <div class="modal-dialog modal-fullscreen"
             id="monacoModalDialog">

            <div class="modal-content modal-content-dark">

                <div class="modal-header border-bottom border-info d-flex justify-content-between align-items-center">

                    <h5 class="modal-title fw-bold text-white mb-0">

                        <i class="bi bi-code-square text-info me-2"></i>

                        Monaco Code Editor

                        <small class="text-muted fs-6 ms-2">
                            (Emmet abilitato - Premi TAB)
                        </small>

                    </h5>

                    <div>

                        <button type="button"
                                class="btn-close btn-close-white"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>

                    </div>

                </div>

                <div class="modal-body p-0">

                    <div class="monaco-extra-toolbar">

                        <!-- RICERCA -->
                        <div class="input-group input-group-sm monaco-search-wrapper">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input type="text"
                                   id="monacoSearchInput"
                                   class="form-control monaco-search-input"
                                   placeholder="Cerca nel codice..."
                                   autocomplete="off">

                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="btnMonacoSearchClear"
                                    title="Cancella">

                                <i class="bi bi-x-lg"></i>

                            </button>

                            <div id="monacoSearchResults"
                                 class="monaco-search-results">

                                <button type="button"
                                        class="btn btn-sm btn-outline-light"
                                        id="monacoSearchPrev"
                                        title="Corrispondenza precedente"
                                        aria-label="Corrispondenza precedente">
                                    <i class="bi bi-chevron-up"></i>
                                </button>

                                <span id="monacoSearchCount"
                                      class="monaco-search-count">
                                    0 / 0
                                </span>

                                <button type="button"
                                        class="btn btn-sm btn-outline-light"
                                        id="monacoSearchNext"
                                        title="Corrispondenza successiva"
                                        aria-label="Corrispondenza successiva">
                                    <i class="bi bi-chevron-down"></i>
                                </button>

                            </div>

                        </div>

                        <!-- ZOOM -->
                        <div class="btn-group btn-group-sm"
                             role="group">

                            <button type="button"
                                    class="btn btn-outline-light"
                                    onclick="changeMonacoFontSize(-1)"
                                    title="Riduci carattere">

                                <i class="bi bi-zoom-out"></i>

                            </button>

                            <span class="btn btn-outline-secondary monaco-zoom-label"
                                  id="monacoZoomLabel">
                                100%
                            </span>

                            <button type="button"
                                    class="btn btn-outline-light"
                                    onclick="changeMonacoFontSize(1)"
                                    title="Aumenta carattere">

                                <i class="bi bi-zoom-in"></i>

                            </button>

                        </div>

                        <!-- MINIMAP -->
                        <button type="button"
                                class="btn btn-sm btn-outline-warning"
                                id="btnTogglePreview"
                                onclick="toggleMonacoPreview()">

                            <i class="bi bi-map me-1"
                               id="previewIcon"></i>

                            <span id="previewButtonText">
                                Nascondi minimappa
                            </span>

                        </button>

                    </div>

                    <!-- WORKSPACE MONACO -->
                    <div id="monacoWorkspace"
                         class="monaco-editor-workspace position-relative">

                        <!-- OVERLAY CARICAMENTO -->
                        <div id="monacoLoadingOverlay"
                             class="monaco-loading-overlay">

                            <div class="monaco-loading-spinner"></div>

                            <div class="text-white">
                                Caricamento editor HTML...
                            </div>

                        </div>

                        <div id="monacoContainer"
                             style="width:100%; height:550px;">
                        </div>

                    </div>

                </div>

                <div class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-between">

                    <div class="text-muted small">

                        <span class="badge bg-secondary me-1">
                            Emmet
                        </span>

                        Usa scorciatoie come
                        <code>div.card>h2</code>
                        + TAB

                    </div>

                    <div>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Annulla
                        </button>

                        <button type="button"
                                class="btn btn-info"
                                onclick="saveMonacoContent()">
                            Applica Modifiche
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================================================
         SCRIPT ESCLUSIVO MONACO
         ============================================================ -->
    <th:block th:fragment="monaco-scripts">

        <script>

            /*
             * ==========================================================
             * CONFIGURAZIONE MONACO
             * ==========================================================
             *
             * Monaco NON viene caricato durante il caricamento della
             * pagina.
             *
             * Viene caricato esclusivamente quando viene chiamata:
             *
             *     openMonacoFromButton(...)
             *
             * Questo evita di rallentare block-form.
             */

            const MONACO_VERSION = '0.50.0';

            const MONACO_LOADER_URL =
                'https://cdn.jsdelivr.net/npm/monaco-editor@'
                + MONACO_VERSION
                + '/min/vs/loader.js';

            const EMMET_URL =
                'https://unpkg.com/emmet-monaco-es@5.7.0/dist/emmet-monaco.min.js';


            /*
             * Istanza Monaco.
             *
             * Viene creata una sola volta.
             */
            let monacoEditor = null;


            /*
             * Promise di caricamento.
             *
             * Se l'utente clicca due volte mentre Monaco sta ancora
             * caricando, non vengono effettuati due caricamenti.
             */
            let monacoLoadingPromise = null;


            /*
             * Elemento textarea/TinyMCE che Monaco sta modificando.
             */
            let monacoTargetId = null;


            /*
             * Dimensione iniziale del font.
             */
            let monacoFontSize = 14;


            /*
             * Stato minimappa.
             */
            let monacoMinimapEnabled = true;


            /*
             * Stato ricerca.
             */
            let monacoSearchMatches = [];
            let monacoSearchIndex = -1;
            let monacoSearchDecorations = [];
            let monacoCurrentSearchDecoration = [];


            /*
             * ==========================================================
             * APERTURA MONACO
             * ==========================================================
             */
            async function openMonacoFromButton(button) {

                const targetId =
                    button?.dataset?.targetId
                    || 'mainContentHtml';

                monacoTargetId = targetId;

                const modalElement =
                    document.getElementById(
                        'monacoEditorModal'
                    );

                if (!modalElement) {

                    console.error(
                        'Modale Monaco non trovata.'
                    );

                    return;
                }


                /*
                 * Apertura immediata della modale.
                 *
                 * In questo modo l'utente vede subito che il
                 * pulsante ha funzionato anche mentre Monaco si carica.
                 */
                const modal =
                    bootstrap.Modal.getOrCreateInstance(
                        modalElement
                    );

                modal.show();


                /*
                 * Caricamento lazy.
                 */
                try {

                    await loadMonaco();

                    await initializeMonacoEditor();

                    if (monacoEditor) {

                        monacoEditor.layout();

                        monacoEditor.focus();
                    }

                } catch (error) {

                    console.error(
                        'Errore durante il caricamento di Monaco:',
                        error
                    );

                    alert(
                        'Non è stato possibile caricare l\'editor HTML avanzato.'
                    );
                }
            }


            /*
             * ==========================================================
             * CARICAMENTO LAZY DI MONACO
             * ==========================================================
             */
            function loadMonaco() {

                /*
                 * Monaco è già disponibile.
                 */
                if (
                    window.monaco
                    && window.monaco.editor
                ) {
                    return Promise.resolve();
                }


                /*
                 * Monaco è già in fase di caricamento.
                 */
                if (monacoLoadingPromise) {
                    return monacoLoadingPromise;
                }


                monacoLoadingPromise =
                    new Promise((resolve, reject) => {

                        showMonacoLoading(true);


                        /*
                         * Se loader.js è già stato inserito nella pagina,
                         * non lo inseriamo una seconda volta.
                         */
                        const existingLoader =
                            document.querySelector(
                                'script[data-monaco-loader="true"]'
                            );


                        const initializeLoader =
                            () => {

                                if (!window.require) {

                                    reject(
                                        new Error(
                                            'AMD loader di Monaco non disponibile.'
                                        )
                                    );

                                    return;
                                }


                                /*
                                 * Configurazione AMD Monaco.
                                 */
                                window.require.config({
                                    paths: {
                                        vs:
                                            'https://cdn.jsdelivr.net/npm/monaco-editor@'
                                            + MONACO_VERSION
                                            + '/min/vs'
                                    }
                                });


                                window.require(
                                    ['vs/editor/editor.main'],
                                    () => {

                                        loadEmmet()
                                            .then(() => {

                                                showMonacoLoading(false);

                                                resolve();

                                            })
                                            .catch(error => {

                                                showMonacoLoading(false);

                                                reject(error);
                                            });
                                    }
                                );
                            };


                        if (existingLoader) {

                            initializeLoader();

                            return;
                        }


                        /*
                         * Worker Monaco.
                         *
                         * Questa configurazione evita che Monaco tenti
                         * di cercare worker relativi alla pagina Spring.
                         */
                        window.MonacoEnvironment = {

                            getWorkerUrl: function () {

                                const workerSource = `
                                    self.MonacoEnvironment = {
                                        baseUrl:
                                            'https://cdn.jsdelivr.net/npm/monaco-editor@${MONACO_VERSION}/min/'
                                    };

                                    importScripts(
                                        'https://cdn.jsdelivr.net/npm/monaco-editor@${MONACO_VERSION}/min/vs/base/worker/workerMain.js'
                                    );
                                `;

                                return 'data:text/javascript;charset=utf-8,'
                                    + encodeURIComponent(workerSource);
                            }
                        };


                        const script =
                            document.createElement('script');

                        script.src =
                            MONACO_LOADER_URL;

                        script.async = true;

                        script.dataset.monacoLoader = 'true';


                        script.onload = () => {

                            initializeLoader();
                        };


                        script.onerror = () => {

                            showMonacoLoading(false);

                            reject(
                                new Error(
                                    'Impossibile caricare loader.js di Monaco.'
                                )
                            );
                        };


                        document.head.appendChild(script);
                    });


                return monacoLoadingPromise;
            }


            /*
             * ==========================================================
             * CARICAMENTO EMMET
             * ==========================================================
             */
            function loadEmmet() {

                /*
                 * Emmet già disponibile.
                 */
                if (
                    window.emmetMonaco
                    || window.emmetHTML
                ) {
                    return Promise.resolve();
                }


                return new Promise((resolve, reject) => {

                    const existingScript =
                        document.querySelector(
                            'script[data-emmet-monaco="true"]'
                        );


                    if (existingScript) {

                        if (window.emmetMonaco) {
                            resolve();
                            return;
                        }

                        existingScript.addEventListener(
                            'load',
                            () => resolve(),
                            { once: true }
                        );

                        existingScript.addEventListener(
                            'error',
                            () => reject(
                                new Error(
                                    'Impossibile caricare Emmet.'
                                )
                            ),
                            { once: true }
                        );

                        return;
                    }


                    const script =
                        document.createElement('script');

                    script.src = EMMET_URL;

                    script.async = true;

                    script.dataset.emmetMonaco = 'true';


                    script.onload = () => {

                        resolve();
                    };


                    script.onerror = () => {

                        reject(
                            new Error(
                                'Impossibile caricare emmet-monaco-es.'
                            )
                        );
                    };


                    document.head.appendChild(script);
                });
            }


            /*
             * ==========================================================
             * INIZIALIZZAZIONE EDITOR
             * ==========================================================
             */
            async function initializeMonacoEditor() {

                if (!window.monaco) {

                    throw new Error(
                        'Monaco non è disponibile.'
                    );
                }


                const container =
                    document.getElementById(
                        'monacoContainer'
                    );

                if (!container) {

                    throw new Error(
                        'Contenitore Monaco non trovato.'
                    );
                }


                /*
                 * Contenuto iniziale.
                 */
                const initialContent =
                    getMonacoTargetContent();


                /*
                 * PRIMA APERTURA:
                 * creiamo l'editor.
                 */
                if (!monacoEditor) {

                    monacoEditor =
                        monaco.editor.create(
                            container,
                            {

                                value:
                                    initialContent,

                                language:
                                    'html',

                                theme:
                                    'vs-dark',

                                automaticLayout:
                                    true,

                                fontSize:
                                    monacoFontSize,

                                minimap: {
                                    enabled:
                                        monacoMinimapEnabled
                                },

                                wordWrap:
                                    'on',

                                tabSize:
                                    4,

                                insertSpaces:
                                    true,

                                formatOnPaste:
                                    true,

                                formatOnType:
                                    true,

                                autoClosingBrackets:
                                    'always',

                                autoClosingQuotes:
                                    'always',

                                autoClosingTags:
                                    true,

                                fixedOverflowWidgets:
                                    true,

                                suggestOnTriggerCharacters:
                                    true,

                                quickSuggestions: {
                                    other: true,
                                    comments: true,
                                    strings: true
                                },

                                suggest: {
                                    showWords:
                                        true,
                                    showSnippets:
                                        true
                                },

                                acceptSuggestionOnEnter:
                                    'on',

                                folding:
                                    true,

                                lineNumbers:
                                    'on',

                                renderWhitespace:
                                    'selection',

                                scrollBeyondLastLine:
                                    false,

                                padding: {
                                    top: 12,
                                    bottom: 12
                                }
                            }
                        );


                    /*
                     * Posizionamento widget suggerimenti
                     * sotto la riga del cursore.
                     */
                    installSuggestionPositioning();

                    monacoEditor.onDidChangeCursorPosition(() => {
                        positionSuggestion();
                    });

                    monacoEditor.onDidScrollChange(() => {
                        positionSuggestion();
                    });


                    /*
                     * Integrazione Emmet.
                     *
                     * Deve avvenire dopo il caricamento di Monaco
                     * e prima dell'utilizzo dell'editor.
                     */
                    if (
                        window.emmetMonaco
                        && typeof window.emmetMonaco.emmetHTML === 'function'
                    ) {

                        try {

                            window.emmetMonaco.emmetHTML(
                                monaco,
                                ['html']
                            );

                        } catch (error) {

                            console.warn(
                                'Emmet non è stato inizializzato:',
                                error
                            );
                        }
                    }


                    /*
                     * Quando il contenuto cambia, aggiorniamo
                     * il textarea/TinyMCE senza salvare ancora
                     * definitivamente il contenuto.
                     */
                    monacoEditor.onDidChangeModelContent(
                        function () {

                            syncMonacoToTarget();
                        }
                    );


                    /*
                     * Inizializzazione ricerca.
                     */
                    initializeMonacoSearch();


                    /*
                     * Aggiornamento etichetta zoom.
                     */
                    updateMonacoZoomLabel();
                }


                /*
                 * Aperture successive:
                 *
                 * recuperiamo il contenuto attuale dal campo,
                 * così Monaco non rimane con una versione vecchia.
                 */
                else {

                    const currentContent =
                        getMonacoTargetContent();

                    const model =
                        monacoEditor.getModel();

                    if (
                        model
                        && model.getValue() !== currentContent
                    ) {

                        model.setValue(
                            currentContent
                        );
                    }
                }


                /*
                 * Layout dopo l'apertura della modale.
                 */
                requestAnimationFrame(() => {

                    if (monacoEditor) {

                        monacoEditor.layout();

                        monacoEditor.focus();
                    }
                });
            }


            /*
             * ==========================================================
             * RECUPERO CONTENUTO DA TINYMCE / TEXTAREA
             * ==========================================================
             */
            function getMonacoTargetContent() {

                const targetId =
                    monacoTargetId
                    || 'mainContentHtml';


                /*
                 * Prima controlliamo TinyMCE.
                 */
                if (
                    window.tinymce
                    && typeof window.tinymce.get === 'function'
                ) {

                    const editor =
                        window.tinymce.get(targetId);

                    if (editor) {

                        return editor.getContent();
                    }
                }


                /*
                 * Fallback textarea/input.
                 */
                const target =
                    document.getElementById(targetId);

                return target
                    ? target.value || ''
                    : '';
            }


            /*
             * ==========================================================
             * SINCRONIZZAZIONE MONACO -> TINYMCE
             * ==========================================================
             */
            function syncMonacoToTarget() {

                if (!monacoEditor)
                    return;


                const content =
                    monacoEditor.getValue();

                const targetId =
                    monacoTargetId
                    || 'mainContentHtml';


                /*
                 * TinyMCE.
                 */
                if (
                    window.tinymce
                    && typeof window.tinymce.get === 'function'
                ) {

                    const editor =
                        window.tinymce.get(targetId);

                    if (editor) {

                        editor.setContent(content);

                        /*
                         * Forziamo l'evento change per mantenere
                         * sincronizzati eventuali listener esistenti.
                         */
                        editor.fire('change');

                        return;
                    }
                }


                /*
                 * Fallback textarea.
                 */
                const target =
                    document.getElementById(targetId);

                if (target) {

                    target.value =
                        content;

                    target.dispatchEvent(
                        new Event(
                            'input',
                            {
                                bubbles: true
                            }
                        )
                    );

                    target.dispatchEvent(
                        new Event(
                            'change',
                            {
                                bubbles: true
                            }
                        )
                    );
                }
            }


            /*
             * ==========================================================
             * SALVA / APPLICA
             * ==========================================================
             */
            function saveMonacoContent() {

                if (!monacoEditor)
                    return;


                syncMonacoToTarget();


                /*
                 * Aggiorniamo immediatamente l'anteprima
                 * presente nel block-form.
                 */
                if (
                    typeof renderRowPreviewIfOpen
                    === 'function'
                ) {

                    renderRowPreviewIfOpen();
                }


                const modalElement =
                    document.getElementById(
                        'monacoEditorModal'
                    );

                if (modalElement) {

                    const modal =
                        bootstrap.Modal.getInstance(
                            modalElement
                        );

                    if (modal) {
                        modal.hide();
                    }
                }
            }


            /*
             * ==========================================================
             * ZOOM
             * ==========================================================
             */
            function changeMonacoFontSize(direction) {

                if (!monacoEditor)
                    return;


                monacoFontSize +=
                    direction * 1;


                /*
                 * Limiti ragionevoli.
                 */
                monacoFontSize =
                    Math.max(
                        10,
                        Math.min(
                            30,
                            monacoFontSize
                        )
                    );


                monacoEditor.updateOptions({
                    fontSize:
                        monacoFontSize
                });


                updateMonacoZoomLabel();
            }


            function updateMonacoZoomLabel() {

                const label =
                    document.getElementById(
                        'monacoZoomLabel'
                    );

                if (!label)
                    return;


                /*
                 * 14px = 100%.
                 */
                const percentage =
                    Math.round(
                        (monacoFontSize / 14) * 100
                    );


                label.textContent =
                    percentage + '%';
            }


            /*
             * ==========================================================
             * MINIMAP
             * ==========================================================
             */
            function toggleMonacoPreview() {

                if (!monacoEditor)
                    return;


                monacoMinimapEnabled =
                    !monacoMinimapEnabled;


                monacoEditor.updateOptions({

                    minimap: {
                        enabled:
                            monacoMinimapEnabled
                    }
                });


                const text =
                    document.getElementById(
                        'previewButtonText'
                    );

                const icon =
                    document.getElementById(
                        'previewIcon'
                    );


                if (text) {

                    text.textContent =
                        monacoMinimapEnabled
                            ? 'Nascondi minimappa'
                            : 'Mostra minimappa';
                }


                if (icon) {

                    icon.className =
                        monacoMinimapEnabled
                            ? 'bi bi-map me-1'
                            : 'bi bi-map-fill me-1';
                }
            }


            /*
             * ==========================================================
             * POSIZIONAMENTO SUGGERIMENTI SOTTO LA RIGA
             * ==========================================================
             */
            function installSuggestionPositioning() {

                if (window.__monacoSuggestObserver) {
                    return;
                }

                window.__monacoSuggestObserver = true;

                const observer = new MutationObserver(positionSuggestion);

                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['style', 'class']
                });

                window.addEventListener('resize', positionSuggestion);
            }


            function positionSuggestion() {

                if (!monacoEditor) {
                    return;
                }

                const widget = document.querySelector('.monaco-editor .suggest-widget');

                if (!widget || getComputedStyle(widget).display === 'none') {
                    return;
                }

                const position = monacoEditor.getPosition();
                const coords = monacoEditor.getScrolledVisiblePosition(position);
                const domNode = monacoEditor.getDomNode();

                if (!position || !coords || !domNode) {
                    return;
                }

                const rect = domNode.getBoundingClientRect();

                widget.style.position = 'fixed';
                widget.style.left = Math.max(4, rect.left + coords.left) + 'px';
                widget.style.top = Math.max(4, rect.top + coords.top + coords.height + 2) + 'px';
                widget.style.zIndex = '10000';
            }


            /*
             * ==========================================================
             * RICERCA MONACO CON NAVIGAZIONE CORRISPONDENZE
             * ==========================================================
             */
            function initializeMonacoSearch() {

                const input =
                    document.getElementById('monacoSearchInput');

                const clearButton =
                    document.getElementById('btnMonacoSearchClear');

                const prevButton =
                    document.getElementById('monacoSearchPrev');

                const nextButton =
                    document.getElementById('monacoSearchNext');


                if (!input)
                    return;


                if (input.dataset.monacoInitialized === 'true') {
                    return;
                }

                input.dataset.monacoInitialized = 'true';


                input.addEventListener('input', function () {
                    performMonacoSearch();
                });


                input.addEventListener('keydown', function (event) {

                    if (event.key === 'Enter') {

                        event.preventDefault();

                        navigateMonacoSearch(
                            event.shiftKey ? -1 : 1
                        );

                    } else if (event.key === 'Escape') {

                        event.preventDefault();

                        clearMonacoSearch();

                        if (monacoEditor) {
                            monacoEditor.focus();
                        }
                    }
                });


                if (clearButton) {

                    clearButton.addEventListener('mousedown', function (event) {
                        event.preventDefault();
                        clearMonacoSearch();
                        if (monacoEditor) {
                            monacoEditor.focus();
                        }
                    });
                }


                if (prevButton) {

                    prevButton.addEventListener('mousedown', function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        navigateMonacoSearch(-1);
                    });
                }


                if (nextButton) {

                    nextButton.addEventListener('mousedown', function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        navigateMonacoSearch(1);
                    });
                }
            }


            function performMonacoSearch() {

                if (!monacoEditor) {
                    return;
                }

                const query =
                    document.getElementById('monacoSearchInput')?.value || '';

                clearMonacoSearchDecorations();

                if (!query) {

                    monacoSearchMatches = [];
                    monacoSearchIndex = -1;

                    updateSearchResults();

                    return;
                }

                const model = monacoEditor.getModel();

                if (!model) {
                    return;
                }

                monacoSearchMatches = model.findMatches(
                    query,
                    true,
                    false,
                    false,
                    null,
                    true
                );

                monacoSearchIndex = monacoSearchMatches.length ? 0 : -1;

                monacoSearchDecorations = monacoEditor.deltaDecorations(
                    [],
                    monacoSearchMatches.map(m => ({
                        range: m.range,
                        options: {
                            inlineClassName: 'monaco-search-match'
                        }
                    }))
                );

                updateCurrentSearchDecoration();

                updateSearchResults();

                if (monacoSearchMatches.length > 0) {

                    monacoEditor.setSelection(
                        monacoSearchMatches[0].range
                    );

                    monacoEditor.revealRangeInCenter(
                        monacoSearchMatches[0].range
                    );
                }
            }


            function clearMonacoSearchDecorations() {

                if (!monacoEditor) {
                    return;
                }

                if (monacoSearchDecorations.length > 0) {

                    monacoSearchDecorations = monacoEditor.deltaDecorations(
                        monacoSearchDecorations,
                        []
                    );
                }

                if (monacoCurrentSearchDecoration.length > 0) {

                    monacoCurrentSearchDecoration = monacoEditor.deltaDecorations(
                        monacoCurrentSearchDecoration,
                        []
                    );
                }

                monacoSearchDecorations = [];
                monacoCurrentSearchDecoration = [];
            }


            function updateCurrentSearchDecoration() {

                if (!monacoEditor || monacoSearchIndex < 0 || !monacoSearchMatches.length) {
                    return;
                }

                if (monacoCurrentSearchDecoration.length > 0) {

                    monacoCurrentSearchDecoration = monacoEditor.deltaDecorations(
                        monacoCurrentSearchDecoration,
                        []
                    );
                }

                const currentMatch = monacoSearchMatches[monacoSearchIndex];

                if (!currentMatch) {
                    return;
                }

                monacoCurrentSearchDecoration = monacoEditor.deltaDecorations(
                    [],
                    [
                        {
                            range: currentMatch.range,
                            options: {
                                inlineClassName: 'monaco-search-match-current'
                            }
                        }
                    ]
                );
            }


            function selectMonacoSearchMatch(index) {

                if (!monacoEditor || !monacoSearchMatches.length) {
                    return;
                }

                monacoSearchIndex =
                    (index + monacoSearchMatches.length) % monacoSearchMatches.length;

                const match = monacoSearchMatches[monacoSearchIndex];

                monacoEditor.setSelection(match.range);

                monacoEditor.revealRangeInCenter(match.range);

                updateCurrentSearchDecoration();

                updateSearchResults();
            }


            function navigateMonacoSearch(direction) {

                if (monacoSearchMatches.length > 0) {

                    selectMonacoSearchMatch(monacoSearchIndex + direction);
                }

                document.getElementById('monacoSearchInput')?.focus();
            }


            function updateSearchResults() {

                const container =
                    document.getElementById('monacoSearchResults');

                const countElement =
                    document.getElementById('monacoSearchCount');


                if (!monacoSearchMatches.length || monacoSearchIndex < 0) {

                    if (container) {
                        container.classList.remove('visible');
                    }

                    if (countElement) {
                        countElement.textContent = '0 / 0';
                    }

                } else {

                    if (countElement) {
                        countElement.textContent =
                            (monacoSearchIndex + 1) + ' / ' + monacoSearchMatches.length;
                    }

                    if (container) {
                        container.classList.add('visible');
                    }
                }
            }


            function clearMonacoSearch() {

                const input =
                    document.getElementById('monacoSearchInput');

                if (input) {
                    input.value = '';
                }

                clearMonacoSearchDecorations();

                monacoSearchMatches = [];
                monacoSearchIndex = -1;

                updateSearchResults();
            }


            /*
             * ==========================================================
             * OVERLAY CARICAMENTO
             * ==========================================================
             */
            function showMonacoLoading(show) {

                const overlay =
                    document.getElementById(
                        'monacoLoadingOverlay'
                    );

                if (!overlay)
                    return;


                overlay.classList.toggle(
                    'visible',
                    Boolean(show)
                );
            }


            /*
             * ==========================================================
             * RESIZE QUANDO LA MODALE DIVENTA VISIBILE
             * ==========================================================
             */
            document.addEventListener(
                'shown.bs.modal',
                function (event) {

                    if (
                        event.target.id
                        !== 'monacoEditorModal'
                    ) {
                        return;
                    }


                    if (monacoEditor) {

                        requestAnimationFrame(() => {

                            monacoEditor.layout();

                            monacoEditor.focus();
                        });
                    }
                }
            );


            /*
             * ==========================================================
             * PULIZIA QUANDO SI CHIUDE LA MODALE
             *
             * IMPORTANTE:
             * NON distruggiamo Monaco.
             *
             * Così alla riapertura viene riutilizzata la stessa
             * istanza e non viene scaricato/ricreato nulla.
             * ==========================================================
             */
            document.addEventListener(
                'hidden.bs.modal',
                function (event) {

                    if (
                        event.target.id
                        !== 'monacoEditorModal'
                    ) {
                        return;
                    }


                    if (monacoEditor) {

                        syncMonacoToTarget();
                    }
                }
            );

        </script>

        <!-- Stile evidenziazioni ricerca Monaco -->
        <style>

            .monaco-search-match {
                background: rgba(255, 215, 0, .28) !important;
                border: 1px solid rgba(255, 215, 0, .55) !important;
                border-radius: 2px;
            }

            .monaco-search-match-current {
                background: rgba(0, 220, 130, .42) !important;
                border: 1px solid rgba(0, 220, 130, .9) !important;
                border-radius: 2px;
            }

        </style>

    </th:block>

</body>
