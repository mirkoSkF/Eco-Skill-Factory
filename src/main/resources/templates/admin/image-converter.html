<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convertitore & Resizer Immagini - Eco Skill Factory</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CROPPER JS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <style>

        /* =========================================================
           VARIABILI GLOBALI
        ========================================================= */

        :root {
            --brand-primary: #00dc82;
            --brand-primary-hover: #00b368;
            --brand-accent: #36e4da;
            --brand-dark: #0f172a;
            --body-bg: #080c14;
            --sidebar-width: 280px;
        }


        /* =========================================================
           RESET / BODY
        ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            background-color: var(--body-bg);
            overflow-x: hidden;
            position: relative;
        }


        /* =========================================================
           SFONDO ANIMATO
        ========================================================= */

        #tech-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }


        /* =========================================================
           LAYOUT PRINCIPALE
        ========================================================= */

        .admin-layout {
            position: relative;
            z-index: 1;

            display: flex;

            min-height: 100vh;
            width: 100%;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .admin-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            flex-shrink: 0;
        }

        .sidebar-nav {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);

            background: rgba(15, 23, 42, 0.92);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-right: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            flex-direction: column;

            position: fixed;

            top: 0;
            bottom: 0;
            left: 0;

            z-index: 1000;
        }


        /* =========================================================
           SIDEBAR LINK
        ========================================================= */

        .sidebar-menu .nav-link,
        .sidebar-nav .nav-link {
            color: #94a3b8;

            font-weight: 500;

            padding: 0.8rem 1.25rem;

            border-radius: 0.5rem;

            margin-bottom: 0.35rem;

            transition: all 0.25s ease;

            display: flex;
            align-items: center;

            text-decoration: none;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active,
        .sidebar-nav .nav-link:hover,
        .sidebar-nav .nav-link.active {
            color: var(--brand-primary) !important;

            background: rgba(0, 220, 130, 0.1);

            transform: translateX(4px);
        }

        .sidebar-menu .nav-link i,
        .sidebar-nav .nav-link i {
            font-size: 1.15rem;
        }


        /* =========================================================
           CONTENUTO PRINCIPALE
           
           IMPORTANTE:
           La sidebar è già un elemento del flex layout.
           Non serve quindi margin-left.
        ========================================================= */

        .main-wrapper {
            flex: 1 1 auto;

            width: auto;

            min-width: 0;

            padding: 2.5rem;

            position: relative;
            z-index: 2;

            margin-left: 0;
        }


        /* =========================================================
           COLORI BRAND
        ========================================================= */

        .brand-text {
            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #cbd5e1 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-accent {
            background: linear-gradient(
                135deg,
                #00dc82 0%,
                #36e4da 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .accent-text {
            color: var(--brand-accent) !important;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .card-custom {
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 1.25rem;

            background: rgba(15, 23, 42, 0.88);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            color: #f1f5f9;

            box-shadow:
                0 10px 25px -5px rgba(0, 0, 0, 0.3);

            position: relative;

            z-index: 3;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-control,
        .form-select {
            background-color: rgba(15, 23, 42, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.15);

            color: #f8fafc;

            border-radius: 0.5rem;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: rgba(15, 23, 42, 0.98);

            border-color: var(--brand-primary);

            color: #ffffff;

            box-shadow:
                0 0 0 0.25rem rgba(0, 220, 130, 0.25);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-check-input {
            background-color: rgba(15, 23, 42, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.25);

            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--brand-primary);

            border-color: var(--brand-primary);
        }

        label,
        .form-label {
            color: #cbd5e1 !important;
        }


        /* =========================================================
           PREVIEW IMMAGINE
        ========================================================= */

        .preview-box {
            background: rgba(11, 19, 41, 0.75);

            border: 2px dashed rgba(255, 255, 255, 0.15);

            border-radius: 1rem;

            min-height: 250px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            position: relative;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .preview-box:hover {
            border-color: rgba(0, 220, 130, 0.35);

            background: rgba(11, 19, 41, 0.9);
        }

        .preview-box img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
        }


        /* =========================================================
           INFO IMMAGINE
        ========================================================= */

        #imageInfo {
            background: rgba(8, 12, 20, 0.75) !important;

            border: 1px solid rgba(255, 255, 255, 0.12) !important;

            border-radius: 0.9rem;

            color: #f1f5f9;

            padding: 1.15rem 0.75rem !important;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        /* Colonne informazioni */

        #imageInfo .col-4 {
            position: relative;

            padding: 0.35rem 0.75rem;
        }

        #imageInfo .col-4 + .col-4::before {
            content: "";

            position: absolute;

            left: 0;

            top: 15%;

            height: 70%;

            width: 1px;

            background: rgba(255, 255, 255, 0.1);
        }

        /* Etichette:
           Larghezza Originale
           Altezza Originale
           Proporzione (Ratio)
        */

        #imageInfo small {
            color: #cbd5e1 !important;

            font-size: 0.78rem;

            font-weight: 600;

            line-height: 1.4;

            letter-spacing: 0.01em;

            margin-bottom: 0.45rem;

            white-space: normal;
        }

        /* Valori */

        #imageInfo strong {
            display: block;

            font-size: 1.05rem;

            font-weight: 800;

            line-height: 1.3;

            letter-spacing: 0.01em;
        }

        #imageInfo #origWidth,
        #imageInfo #origHeight {
            color: var(--brand-primary) !important;
        }

        #imageInfo #origRatio {
            color: var(--brand-accent) !important;
        }


        /* =========================================================
           BOTTONI BRAND
        ========================================================= */

        .btn-brand {
            background: linear-gradient(
                135deg,
                #00dc82 0%,
                #00b368 100%
            );

            color: #0f172a;

            font-weight: 700;

            border: none;

            border-radius: 0.5rem;

            transition: all 0.3s ease;

            box-shadow:
                0 4px 12px rgba(0, 220, 130, 0.25);
        }

        .btn-brand:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 20px rgba(0, 220, 130, 0.4);

            color: #0f172a;
        }


        /* =========================================================
           RANGE
        ========================================================= */

        .form-range::-webkit-slider-thumb {
            background: var(--brand-primary);
        }

        .form-range::-moz-range-thumb {
            background: var(--brand-primary);
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 991.98px) {

            .admin-sidebar {
                width: 100%;
                min-width: 100%;
            }

            .sidebar-nav {
                position: relative;

                width: 100%;
                min-width: 100%;

                height: auto;

                border-right: none;

                border-bottom:
                    1px solid rgba(255, 255, 255, 0.08);
            }

            .admin-layout {
                flex-direction: column;
            }

            .main-wrapper {
                margin-left: 0;

                width: 100%;

                padding: 1.5rem;
            }

            #imageInfo {
                padding: 1rem 0.5rem !important;
            }

            #imageInfo .col-4 {
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }

            #imageInfo small {
                font-size: 0.74rem;
            }

            #imageInfo strong {
                font-size: 0.95rem;
            }
        }


        @media (max-width: 575.98px) {

            .main-wrapper {
                padding: 1rem;
            }

            .main-wrapper h2 {
                font-size: 1.35rem;
            }

            .main-wrapper > .d-flex {
                align-items: flex-start !important;
                gap: 1rem;
            }

            .main-wrapper > .d-flex .btn {
                white-space: nowrap;
            }

            .preview-box {
                min-height: 220px;
            }

            /* Su schermi molto piccoli rendiamo le informazioni
               ancora più leggibili */

            #imageInfo {
                padding: 0.9rem 0.25rem !important;
            }

            #imageInfo .col-4 {
                padding-left: 0.35rem;
                padding-right: 0.35rem;
            }

            #imageInfo small {
                font-size: 0.68rem;
            }

            #imageInfo strong {
                font-size: 0.85rem;
            }
        }

        /* CROPPER OVERRIDES PER DARK THEME */
        .cropper-view-box,
        .cropper-face {
            border-radius: 0.25rem;
        }
        .cropper-line, .cropper-point {
            background-color: var(--brand-primary);
        }

    </style>
</head>


<body>

<!-- =========================================================
     SFONDO ANIMATO
========================================================= -->

<canvas id="tech-bg-canvas"></canvas>


<!-- =========================================================
     LAYOUT ADMIN
========================================================= -->

<div class="admin-layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div class="admin-sidebar">

        <div th:replace="~{fragments/sidebar :: sidebar('image-converter')}"></div>

    </div>


    <!-- =====================================================
         CONTENUTO PRINCIPALE
    ====================================================== -->

    <main class="main-wrapper">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="mb-0 fw-bold text-white">

                <i class="bi bi-arrow-repeat accent-text me-2"></i>

                Convertitore & Resizer Immagini

            </h2>


            <a th:href="@{/admin/dashboard}"
               class="btn btn-outline-light">

                <i class="bi bi-arrow-left me-1"></i>

                Torna alla Dashboard

            </a>

        </div>


        <!-- =================================================
             CONTENUTO PRINCIPALE
        ================================================== -->

        <div class="row g-4">


            <!-- =================================================
                 FORM PARAMETRI
            ================================================== -->

            <div class="col-lg-5">

                <form id="convertForm"
                      class="card card-custom p-4 h-100">


                    <h4 class="mb-3 text-info fw-bold">

                        <i class="bi bi-sliders me-2"></i>

                        Parametri Immagine

                    </h4>


                    <!-- IMMAGINE SORGENTE -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Seleziona Immagine Sorgente

                        </label>

                        <input type="file"
                               id="imageInput"
                               class="form-control"
                               accept="image/*"
                               required
                               onchange="loadImagePreview(this)">

                    </div>


                    <!-- FORMATO DESTINAZIONE -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Formato di Destinazione

                        </label>

                        <select id="targetFormat"
                                class="form-select">

                            <option value="webp" selected>
                                WEBP (Web Ottimizzato - Alta Compressione)
                            </option>

                            <option value="png">
                                PNG (Trasparenza senza perdite)
                            </option>

                            <option value="jpg">
                                JPG / JPEG (Standard Foto)
                            </option>

                            <option value="gif">
                                GIF (Animazioni / Grafica)
                            </option>


                        </select>

                    </div>


                    <!-- UNITÀ DIMENSIONI -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Unità Dimensioni

                        </label>

                        <div class="d-flex gap-3">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="unitType"
                                       id="unitPx"
                                       value="px"
                                       checked
                                       onchange="switchUnit()">

                                <label class="form-check-label text-light"
                                       for="unitPx">

                                    Pixel (px)

                                </label>

                            </div>


                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="unitType"
                                       id="unitPercent"
                                       value="%"
                                       onchange="switchUnit()">

                                <label class="form-check-label text-light"
                                       for="unitPercent">

                                    Percentuale (%)

                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- ASPECT RATIO -->

                    <div class="form-check form-switch mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               id="aspectRatioSwitch"
                               checked>

                        <label class="form-check-label text-warning"
                               for="aspectRatioSwitch">

                            <i class="bi bi-aspect-ratio me-1"></i>

                            Mantieni proporzioni (Aspect Ratio)

                        </label>

                    </div>


                    <!-- RITAGLIO IMMAGINE (CROP) -->

                    <div class="form-check form-switch mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               id="enableCropSwitch"
                               onchange="toggleCropMode(this.checked)">

                        <label class="form-check-label text-info"
                               for="enableCropSwitch">

                            <i class="bi bi-crop me-1"></i>

                            Attiva Ritaglio (Crop)

                        </label>

                    </div>


                    <!-- DIMENSIONI -->

                    <div class="row g-2 mb-4">

                        <div class="col-6">

                            <label class="form-label fw-bold"
                                   id="widthLabel">

                                Larghezza (px)

                            </label>

                            <input type="number"
                                   id="imgWidth"
                                   class="form-control"
                                   min="1"
                                   step="any"
                                   placeholder="es. 1920"
                                   oninput="onWidthChange()">

                        </div>


                        <div class="col-6">

                            <label class="form-label fw-bold"
                                   id="heightLabel">

                                Altezza (px)

                            </label>

                            <input type="number"
                                   id="imgHeight"
                                   class="form-control"
                                   min="1"
                                   step="any"
                                   placeholder="es. 1080"
                                   oninput="onHeightChange()">

                        </div>

                    </div>


                    <!-- PULSANTE CONVERSIONE -->

                    <div class="mt-auto d-grid gap-2">

                        <button type="submit"
                                class="btn btn-brand btn-lg fw-bold">

                            <i class="bi bi-download me-2"></i>

                            Converti & Scarica

                        </button>

                    </div>

                </form>

            </div>


            <!-- =================================================
                 ANTEPRIMA
            ================================================== -->

            <div class="col-lg-7">

                <div class="card card-custom p-4 h-100">


                    <h4 class="mb-3 text-info fw-bold d-flex justify-content-between align-items-center">

                        <span>
                            <i class="bi bi-image me-2"></i>
                            Anteprima Immagine
                        </span>

                        <!-- CONTROLLI CROPPER JS -->

                        <div id="cropControls" class="btn-group btn-group-sm" style="display: none;">

                            <button type="button" class="btn btn-outline-info" onclick="resetCrop()" title="Ripristina Ritaglio">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>

                            <button type="button" class="btn btn-outline-info" onclick="setCropRatio(1)" title="1:1 Quadrato">
                                1:1
                            </button>

                            <button type="button" class="btn btn-outline-info" onclick="setCropRatio(16/9)" title="16:9 Wide">
                                16:9
                            </button>

                            <button type="button" class="btn btn-outline-info" onclick="setCropRatio(NaN)" title="Libero">
                                Libero
                            </button>

                        </div>

                    </h4>


                    <!-- BOX PREVIEW -->

                    <div class="preview-box mb-3"
                         id="previewContainer">


                        <div id="placeholderText" class="text-center text-light">
    <i class="bi bi-cloud-upload fs-1 d-block mb-2 text-warning"></i>
    Carica un'immagine per vederne l'anteprima e le dimensioni originali.
</div>


                        <img id="imagePreview"
                             src=""
                             alt="Anteprima"
                             style="display: none;">

                    </div>


                    <!-- INFORMAZIONI IMMAGINE -->

                    <div id="imageInfo"
                         class="alert alert-secondary mb-0"
                         style="display: none;">

                        <div class="row text-center">


                            <div class="col-4">

                                <small class="text-muted d-block">

                                    Larghezza Originale

                                </small>

                                <strong id="origWidth"
                                        class="text-success">

                                    -

                                </strong>

                            </div>


                            <div class="col-4">

                                <small class="text-muted d-block">

                                    Altezza Originale

                                </small>

                                <strong id="origHeight"
                                        class="text-success">

                                    -

                                </strong>

                            </div>


                            <div class="col-4">

                                <small class="text-muted d-block">

                                    Proporzione (Ratio)

                                </small>

                                <strong id="origRatio"
                                        class="accent-text">

                                    -

                                </strong>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     SCRIPT CONVERTITORE / RESIZER
========================================================= -->

<script>

    let originalWidth = 0;
    let originalHeight = 0;
    let aspectRatio = 1;
    let previousUnit = 'px';


    /* =========================================================
       CARICAMENTO IMMAGINE E ANTEPRIMA
    ========================================================= */

    function loadImagePreview(input) {

        if (input.files && input.files[0]) {

            const reader = new FileReader();

            reader.onload = function (e) {

                const img = new Image();

                img.src = e.target.result;

                img.onload = function () {

                    originalWidth = this.width;

                    originalHeight = this.height;

                    aspectRatio =
                        originalWidth / originalHeight;


                    /* Reset unità */

                    document.getElementById('unitPx').checked = true;

                    previousUnit = 'px';


                    document.getElementById('widthLabel').innerText =
                        'Larghezza (px)';

                    document.getElementById('heightLabel').innerText =
                        'Altezza (px)';


                    /* Dimensioni originali */

                    document.getElementById('imgWidth').value =
                        originalWidth;

                    document.getElementById('imgHeight').value =
                        originalHeight;


                    /* Preview */

                    document.getElementById('imagePreview').src =
                        e.target.result;

                    document.getElementById('imagePreview').style.display =
                        'block';

                    document.getElementById('placeholderText').style.display =
                        'none';


                    /* Informazioni */

                    document.getElementById('origWidth').innerText =
                        originalWidth + ' px';

                    document.getElementById('origHeight').innerText =
                        originalHeight + ' px';

                    document.getElementById('origRatio').innerText =
                        aspectRatio.toFixed(2);

                    document.getElementById('imageInfo').style.display =
                        'block';

                    /* Reset eventuale Cropper precedentemente attivo */
                    if (cropper) {
                        cropper.destroy();
                        cropper = null;
                    }

                    if (document.getElementById('enableCropSwitch').checked) {
                        initCropper();
                    }
                };
            };

            reader.readAsDataURL(input.files[0]);
        }
    }


    /* =========================================================
       CAMBIO UNITÀ
    ========================================================= */

    function switchUnit() {

        const currentUnit =
            document.querySelector(
                'input[name="unitType"]:checked'
            ).value;


        document.getElementById('widthLabel').innerText =
            `Larghezza (${currentUnit})`;

        document.getElementById('heightLabel').innerText =
            `Altezza (${currentUnit})`;


        if (
            originalWidth === 0 ||
            previousUnit === currentUnit
        ) {
            return;
        }


        const wInput =
            document.getElementById('imgWidth');

        const hInput =
            document.getElementById('imgHeight');


        let currentW =
            parseFloat(wInput.value) || 0;

        let currentH =
            parseFloat(hInput.value) || 0;


        if (currentUnit === '%') {

            wInput.value =
                Math.round(
                    (currentW / originalWidth) * 100
                );

            hInput.value =
                Math.round(
                    (currentH / originalHeight) * 100
                );

        } else {

            wInput.value =
                Math.round(
                    (currentW * originalWidth) / 100
                );

            hInput.value =
                Math.round(
                    (currentH * originalHeight) / 100
                );
        }


        previousUnit = currentUnit;
    }


    /* =========================================================
       MODIFICA LARGHEZZA
    ========================================================= */

    function onWidthChange() {

        const keepRatio =
            document.getElementById(
                'aspectRatioSwitch'
            ).checked;


        if (
            !keepRatio ||
            originalWidth === 0
        ) {
            return;
        }


        const unit =
            document.querySelector(
                'input[name="unitType"]:checked'
            ).value;


        const wVal =
            parseFloat(
                document.getElementById('imgWidth').value
            ) || 0;


        if (unit === 'px') {

            document.getElementById('imgHeight').value =
                Math.round(
                    wVal / aspectRatio
                );

        } else {

            document.getElementById('imgHeight').value =
                Math.round(wVal);
        }
    }


    /* =========================================================
       MODIFICA ALTEZZA
    ========================================================= */

    function onHeightChange() {

        const keepRatio =
            document.getElementById(
                'aspectRatioSwitch'
            ).checked;


        if (
            !keepRatio ||
            originalHeight === 0
        ) {
            return;
        }


        const unit =
            document.querySelector(
                'input[name="unitType"]:checked'
            ).value;


        const hVal =
            parseFloat(
                document.getElementById('imgHeight').value
            ) || 0;


        if (unit === 'px') {

            document.getElementById('imgWidth').value =
                Math.round(
                    hVal * aspectRatio
                );

        } else {

            document.getElementById('imgWidth').value =
                Math.round(hVal);
        }
    }


    /* =========================================================
       CONVERSIONE
    ========================================================= */

    document.getElementById(
        'convertForm'
    ).addEventListener(
        'submit',
        function (e) {

            e.preventDefault();


            const fileInput =
                document.getElementById(
                    'imageInput'
                );


            if (
                !fileInput.files ||
                fileInput.files.length === 0
            ) {

                alert(
                    'Seleziona un\'immagine prima di procedere.'
                );

                return;
            }


            const unit =
                document.querySelector(
                    'input[name="unitType"]:checked'
                ).value;


            let targetW =
                parseFloat(
                    document.getElementById('imgWidth').value
                ) || 0;


            let targetH =
                parseFloat(
                    document.getElementById('imgHeight').value
                ) || 0;


            /* Conversione percentuale -> pixel */

            if (unit === '%') {

                targetW =
                    Math.round(
                        (originalWidth * targetW) / 100
                    );

                targetH =
                    Math.round(
                        (originalHeight * targetH) / 100
                    );
            }


            const formData =
                new FormData();


            formData.append(
                'file',
                fileInput.files[0]
            );


            formData.append(
                'targetFormat',
                document.getElementById(
                    'targetFormat'
                ).value
            );


            formData.append(
                'width',
                Math.round(targetW)
            );


            formData.append(
                'height',
                Math.round(targetH)
            );


            /* INVIO PARAMETRI CROP IN CASO DI ATTIVAZIONE */

            if (cropper && document.getElementById('enableCropSwitch').checked) {

                const cropData = cropper.getData(true);

                formData.append('cropX', cropData.x);

                formData.append('cropY', cropData.y);

                formData.append('cropWidth', cropData.width);

                formData.append('cropHeight', cropData.height);
            }


            /* Chiamata API */

            fetch(
                '/api/tools/convert-image',
                {
                    method: 'POST',
                    body: formData
                }
            )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Errore durante la conversione del file.'
                    );
                }

                return response.blob();
            })
            .then(blob => {

                const url =
                    window.URL.createObjectURL(blob);


                const a =
                    document.createElement('a');


                const targetFormat =
                    document.getElementById(
                        'targetFormat'
                    ).value;


                a.href = url;


                a.download =
                    `converted_image.${targetFormat}`;


                document.body.appendChild(a);


                a.click();


                a.remove();


                window.URL.revokeObjectURL(url);
            })
            .catch(err => {

                alert(
                    'Errore durante la conversione: ' +
                    err.message
                );
            });

        }
    );

</script>


<!-- =========================================================
     CROPPER JS & LOGICA CROP
========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>

    let cropper = null;


    function initCropper() {

        const img = document.getElementById('imagePreview');

        if (!img || !img.src || img.style.display === 'none') {
            return;
        }


        if (cropper) {
            cropper.destroy();
        }


        cropper = new Cropper(img, {

            viewMode: 1,

            autoCropArea: 0.8,

            responsive: true,

            crop(event) {

                const detail = event.detail;

                /* Se l'utente sta usando il crop, aggiorniamo le dimensioni finali di output */

                if (document.getElementById('enableCropSwitch').checked) {

                    const unit = document.querySelector('input[name="unitType"]:checked').value;

                    let cropW = Math.round(detail.width);

                    let cropH = Math.round(detail.height);


                    if (unit === '%') {

                        document.getElementById('imgWidth').value = Math.round((cropW / originalWidth) * 100);

                        document.getElementById('imgHeight').value = Math.round((cropH / originalHeight) * 100);

                    } else {

                        document.getElementById('imgWidth').value = cropW;

                        document.getElementById('imgHeight').value = cropH;

                    }

                }

            }

        });


        document.getElementById('cropControls').style.display = 'inline-flex';

    }


    function toggleCropMode(enabled) {

        if (enabled) {

            initCropper();

        } else {

            if (cropper) {

                cropper.destroy();

                cropper = null;

            }

            document.getElementById('cropControls').style.display = 'none';

            /* Ripristina i valori di input originali */

            document.getElementById('imgWidth').value = originalWidth;

            document.getElementById('imgHeight').value = originalHeight;

        }

    }


    function resetCrop() {

        if (cropper) {

            cropper.reset();

        }

    }


    function setCropRatio(ratio) {

        if (cropper) {

            cropper.setAspectRatio(ratio);

        }

    }

</script>


<!-- =========================================================
     SFONDO ANIMATO TECH
========================================================= -->

<script>

    const canvas =
        document.getElementById(
            'tech-bg-canvas'
        );

    const ctx =
        canvas.getContext('2d');


    let width;
    let height;


    /* =========================================================
       RIDIMENSIONAMENTO CANVAS
    ========================================================= */

    function resize() {

        width =
            canvas.width =
                window.innerWidth;

        height =
            canvas.height =
                window.innerHeight;
    }


    window.addEventListener(
        'resize',
        resize
    );


    resize();


    /* =========================================================
       CIRCUIT
    ========================================================= */

    class Circuit {

        constructor() {

            this.reset();
        }


        reset() {

            this.x =
                Math.random() * width;

            this.y =
                Math.random() * height;


            this.length =
                Math.floor(
                    Math.random() * 8
                ) + 4;


            this.currentStep = 0;


            this.dir =
                Math.floor(
                    Math.random() * 4
                );


            this.path = [
                {
                    x: this.x,
                    y: this.y
                }
            ];


            this.speed =
                Math.random() * 1.5 + 0.5;


            this.alpha =
                Math.random() * 0.4 + 0.1;


            this.size = 20;
        }


        update() {

            if (
                this.currentStep <
                this.length
            ) {

                let last =
                    this.path[
                        this.path.length - 1
                    ];


                let nx = last.x;
                let ny = last.y;


                if (
                    Math.random() < 0.3
                ) {

                    this.dir =
                        (
                            this.dir +
                            (
                                Math.random() < 0.5
                                    ? 1
                                    : 3
                            )
                        ) % 4;
                }


                switch (this.dir) {

                    case 0:

                        ny -= this.size;

                        break;


                    case 1:

                        nx += this.size;

                        break;


                    case 2:

                        ny += this.size;

                        break;


                    case 3:

                        nx -= this.size;

                        break;
                }


                this.path.push({
                    x: nx,
                    y: ny
                });


                this.currentStep++;

            } else {

                this.alpha -= 0.005;


                if (this.alpha <= 0) {

                    this.reset();
                }
            }
        }


        draw() {

            if (
                this.path.length < 2
            ) {
                return;
            }


            ctx.beginPath();


            ctx.moveTo(
                this.path[0].x,
                this.path[0].y
            );


            for (
                let i = 1;
                i < this.path.length;
                i++
            ) {

                ctx.lineTo(
                    this.path[i].x,
                    this.path[i].y
                );
            }


            ctx.strokeStyle =
                `rgba(
                    0,
                    220,
                    130,
                    ${this.alpha}
                )`;


            ctx.lineWidth = 1.5;


            ctx.stroke();


            let last =
                this.path[
                    this.path.length - 1
                ];


            ctx.beginPath();


            ctx.arc(
                last.x,
                last.y,
                3,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    54,
                    228,
                    218,
                    ${this.alpha + 0.2}
                )`;


            ctx.fill();
        }
    }


    /* =========================================================
       TESTI / CODICE FLOTTANTE
    ========================================================= */

    const codeSnippets = [

        "class BlockManager {}",

        "import spring.boot.*;",

        "<div class='eco'>",

        "SELECT * FROM blocks;",

        "const init = () => {};",

        "return new PageBlock();",

        "01000101 01000011 01001111",

        "public static void main()",

        "async fetch('/api')",

        "npm run build",

        "docker-compose up -d",

        "mvn clean install"
    ];


    class CodeText {

        constructor() {

            this.reset();
        }


        reset() {

            this.x =
                Math.random() *
                Math.max(
                    1,
                    width - 200
                );


            this.y =
                Math.random() *
                height;


            this.text =
                codeSnippets[
                    Math.floor(
                        Math.random() *
                        codeSnippets.length
                    )
                ];


            this.alpha = 0;


            this.maxAlpha =
                Math.random() * 0.3 + 0.1;


            this.fadeIn = true;


            this.speed =
                Math.random() * 0.3 + 0.1;
        }


        update() {

            this.y -= this.speed;


            if (this.fadeIn) {

                this.alpha += 0.008;


                if (
                    this.alpha >=
                    this.maxAlpha
                ) {

                    this.fadeIn = false;
                }

            } else {

                this.alpha -= 0.005;


                if (
                    this.alpha <= 0
                ) {

                    this.reset();
                }
            }
        }


        draw() {

            ctx.font =
                '12px "Fira Code", monospace';


            ctx.fillStyle =
                `rgba(
                    0,
                    220,
                    130,
                    ${this.alpha}
                )`;


            ctx.fillText(
                this.text,
                this.x,
                this.y
            );
        }
    }


    /* =========================================================
       CREAZIONE ELEMENTI
    ========================================================= */

    const circuits =
        Array.from(
            { length: 18 },
            () => new Circuit()
        );


    const codeTexts =
        Array.from(
            { length: 12 },
            () => new CodeText()
        );


    /* =========================================================
       ANIMAZIONE
    ========================================================= */

    function animate() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        circuits.forEach(
            circuit => {

                circuit.update();

                circuit.draw();
            }
        );


        codeTexts.forEach(
            codeText => {

                codeText.update();

                codeText.draw();
            }
        );


        requestAnimationFrame(
            animate
        );
    }


    animate();

</script>
