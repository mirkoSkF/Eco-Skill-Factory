<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Utente - Eco Skill Factory</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            min-height: 100vh;
        }

        .profile-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .avatar-preview {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border: 3px solid #00dc82;
            box-shadow: 0 0 15px rgba(0, 220, 130, 0.4);
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: #00dc82;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(0, 220, 130, 0.2);
        }

        .btn-success-custom {
            background: linear-gradient(135deg, #00dc82 0%, #00b368 100%);
            border: none;
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-25 py-3" style="background: rgba(15, 23, 42, 0.9);">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-cpu-fill text-success fs-4"></i>
            <span>Eco Skill Factory</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="btn btn-outline-light btn-sm rounded-3">
                <i class="bi bi-globe me-1"></i> Sito Pubblico
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm rounded-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            
            <div class="card profile-card p-4 p-md-5">
                <h4 class="fw-bold mb-4 text-white"><i class="bi bi-person-gear text-success me-2"></i>Gestione Profilo</h4>

                <div th:if="${param.success}" class="alert alert-success d-flex align-items-center py-2 small" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>Profilo aggiornato con successo!</div>
                </div>

                <form th:action="@{/user/profile/update}" method="post" enctype="multipart/form-data">
                    
                    <!-- Avatar Preview & Upload -->
                    <div class="text-center mb-4">
                        <div class="position-relative d-inline-block">
                            <img th:if="${user.avatarUrl != null}" th:src="@{'/uploads/' + ${user.avatarUrl}}" class="rounded-circle avatar-preview mb-2" alt="Avatar">
                            <img th:if="${user.avatarUrl == null}" src="https://via.placeholder.com/110/0f172a/00dc82?text=User" class="rounded-circle avatar-preview mb-2" alt="Default Avatar">
                        </div>
                        <div class="mt-2">
                            <label for="foto" class="btn btn-sm btn-outline-secondary text-light">
                                <i class="bi bi-camera me-1"></i> Carica Nuova Foto
                            </label>
                            <input type="file" id="foto" name="foto" class="d-none" accept="image/*" onchange="previewImage(event)">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light opacity-75 small">Email (Non Modificabile)</label>
                        <input type="email" class="form-control" th:value="${user.email}" disabled readonly>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-light opacity-75 small">Nome</label>
                            <input type="text" name="nome" class="form-control" th:value="${user.nome}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-light opacity-75 small">Cognome</label>
                            <input type="text" name="cognome" class="form-control" th:value="${user.cognome}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success-custom w-100 py-2 mt-3 shadow-sm">
                        <i class="bi bi-save me-1"></i> Salva Modifiche
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.querySelector('.avatar-preview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
