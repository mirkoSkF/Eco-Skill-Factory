<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Skill Factory</title>
    <!-- Bootstrap 5 CSS e Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .block-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .carousel-item img {
            object-fit: cover;
            max-height: 500px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header / Navbar Minimal -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase tracking-wide" href="/">
                Eco <span class="text-primary">Skill Factory</span>
            </a>
            <div class="ms-auto">
                <a href="/login" class="btn btn-outline-light btn-sm"><i class="bi bi-lock-fill"></i> Area Admin</a>
            </div>
        </div>
    </header>

    <!-- Main Content: Iterazione dinamica sulle righe della pagina -->
    <main>
        <div th:each="block : ${blocks}" 
             th:class="${block.containerType.cssClass} + ' py-4 block-container ' + ${block.backgroundColor}"
             th:style="'min-height:' + ${block.customHeight}">

            <!-- MODELLO 1: JUMBOTRON / SEZIONE TESTO -->
            <div th:if="${block.blockType.name() == 'JUMBOTRON'}" class="p-5 mb-4 rounded-3 border shadow-sm">
                <div class="container-fluid py-2" th:utext="${block.contentHtml}">
                    <!-- Contenuto TinyMCE iniettato direttamente -->
                </div>
            </div>

            <!-- MODELLO 2: GRIGLIA CARD (2 o 3 Colonne) -->
            <div th:if="${block.blockType.name() == 'CARDS'}">
                <div th:if="${block.contentHtml != null and !block.contentHtml.empty}" class="mb-4" th:utext="${block.contentHtml}">
                    <!-- Testo introduttivo facoltativo della sezione -->
                </div>
                <div class="row g-4 align-items-stretch">
                    <div th:each="item : ${block.items}" class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <img th:if="${item.imageUrl != null and !item.imageUrl.empty}" 
                                 th:src="${item.imageUrl}" class="card-img-top" alt="Card Image" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <h4 class="card-title fw-bold" th:text="${item.title}">Titolo Card</h4>
                                <h6 th:if="${item.subtitle != null}" class="card-subtitle mb-2 text-muted" th:text="${item.subtitle}">Sottotitolo</h6>
                                <div class="card-text flex-grow-1" th:utext="${item.contentHtml}"></div>
                                <div th:if="${item.buttonText != null and !item.buttonText.empty}" class="mt-3">
                                    <a th:href="${item.buttonUrl}" class="btn btn-primary w-100" th:text="${item.buttonText}">Scopri di più</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MODELLO 3: CAROSELLO -->
            <div th:if="${block.blockType.name() == 'CAROUSEL'}" th:id="'carouselBlock-' + ${block.id}" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div th:each="item, iterStat : ${block.items}" 
                         th:class="'carousel-item ' + ${iterStat.index == 0 ? 'active' : ''}">
                        <img th:src="${item.imageUrl != null and !item.imageUrl.empty ? item.imageUrl : 'https://via.placeholder.com/1200x400'}" class="d-block w-100" th:alt="${item.title}">
                        <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
                            <h3 class="fw-bold" th:text="${item.title}">Titolo Slide</h3>
                            <div th:utext="${item.contentHtml}"></div>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" th:data-bs-target="'#carouselBlock-' + ${block.id}" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Precedente</span>
                </button>
                <button class="carousel-control-next" type="button" th:data-bs-target="'#carouselBlock-' + ${block.id}" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Successivo</span>
                </button>
            </div>

        </div>

        <!-- Messaggio di fallback se non ci sono ancora righe create -->
        <div th:if="${#lists.isEmpty(blocks)}" class="container py-5 text-center">
            <h2 class="text-muted">Benvenuto su Eco Skill Factory</h2>
            <p>Nessun contenuto configurato. Accedi all'area riservata per aggiungere le prime righe.</p>
            <a href="/login" class="btn btn-primary">Accedi al CMS</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 Eco Skill Factory - Tutti i diritti riservati.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
