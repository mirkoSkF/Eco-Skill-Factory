<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="sidebar-nav p-3" th:fragment="sidebar(activeMenu)">
        
        <!-- RIDUZIONE SIDEBAR DEL 20% -->
        <style>
            :root {
                --sidebar-width: 224px;
            }

            /* Dimensionamento proporzionato della sidebar */
            .sidebar-nav {
                font-size: 0.8rem;
            }

            /* LOGO */
            .sidebar-nav .navbar-brand {
                font-size: 0.8rem !important;
                gap: 0.4rem !important;
                margin-bottom: 0.6rem !important;
                padding: 0.4rem 0.4rem !important;
            }

            .sidebar-nav .navbar-brand .bi-cpu-fill {
                font-size: 1.5rem !important;
            }

            .sidebar-nav .navbar-brand .brand-text,
            .sidebar-nav .navbar-brand .brand-accent {
                font-size: 0.9rem;
            }

            .sidebar-nav .navbar-brand .small {
                font-size: 0.65rem !important;
            }

            /* SEZIONE VEDI SITO / LOGOUT */
            .sidebar-nav > div.pb-3 {
                padding-bottom: 0.6rem !important;
                margin-bottom: 0.6rem !important;
                gap: 0.4rem !important;
            }

            .sidebar-nav .btn {
                font-size: 0.75rem;
                padding-top: 0.4rem !important;
                padding-bottom: 0.4rem !important;
                border-radius: 0.45rem !important;
            }

            .sidebar-nav .btn .bi {
                font-size: 0.85rem;
            }

            .sidebar-nav .btn .me-2 {
                margin-right: 0.4rem !important;
            }

            /* MENU */
            .sidebar-nav .sidebar-menu .nav-link {
                font-size: 0.8rem;
                padding: 0.55rem 0.65rem;
                margin-bottom: 0.2rem;
                border-radius: 0.45rem;
            }

            .sidebar-nav .sidebar-menu .nav-link .bi {
                font-size: 0.9rem;
            }

            .sidebar-nav .sidebar-menu .nav-link .me-2 {
                margin-right: 0.4rem !important;
            }

            /* Mantiene la sidebar al 100% su dispositivi mobili */
            @media (max-width: 991.98px) {
                :root {
                    --sidebar-width: 224px;
                }

                .sidebar-nav {
                    font-size: 1rem;
                }

                .sidebar-nav .navbar-brand {
                    font-size: 1rem !important;
                }

                .sidebar-nav .navbar-brand .brand-text,
                .sidebar-nav .navbar-brand .brand-accent {
                    font-size: 1rem;
                }

                .sidebar-nav .btn,
                .sidebar-nav .sidebar-menu .nav-link {
                    font-size: 1rem;
                }
            }
        </style>

        <!-- LOGO -->
        <a class="navbar-brand fw-extrabold fs-5 d-flex align-items-center gap-2 mb-3 px-2 py-2" th:href="@{/admin/dashboard}">
            <i class="bi bi-cpu-fill text-success fs-3"></i>
            <div>
                <span class="brand-text fw-bold">Eco</span>
                <span class="brand-accent fw-bold">Skill Factory</span>
                <div class="small text-uppercase text-secondary fs-6 tracking-wider">CMS Admin</div>
            </div>
        </a>

        <!-- AZIONI VEDI SITO & LOGOUT -->
        <div class="pb-3 mb-3 border-bottom border-secondary border-opacity-25 d-flex flex-column gap-2">
            <a th:href="@{/}" class="btn btn-outline-success btn-sm w-100 rounded-3 text-start d-flex align-items-center justify-content-between py-2 fw-semibold">
                <span><i class="bi bi-eye me-2"></i>Vedi Sito</span>
                <i class="bi bi-arrow-right"></i>
            </a>

            <a th:href="@{/logout}" class="btn btn-danger btn-sm w-100 rounded-3 text-start bg-opacity-75 d-flex align-items-center py-2 fw-semibold">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
            </a>
        </div>

        <!-- MENU PRINCIPALE -->
        <div class="sidebar-menu flex-grow-1">
            <a th:class="${activeMenu == 'dashboard'} ? 'nav-link active' : 'nav-link'" th:href="@{/admin/dashboard}">
                <i class="bi bi-layers-half me-2"></i>
                Righe Home Page
            </a>

            <a th:class="${activeMenu == 'pages'} ? 'nav-link active' : 'nav-link'" th:href="@{/admin/pages}">
                <i class="bi bi-file-earmark-text me-2"></i>
                Pagine Dinamiche
            </a>

            <a th:class="${activeMenu == 'bookings'} ? 'nav-link active' : 'nav-link'" th:href="@{/admin/bookings}">
                <i class="bi bi-person-lines-fill me-2"></i>
                Prenotazioni Form
            </a>

            <a th:class="${activeMenu == 'navbar'} ? 'nav-link active' : 'nav-link'" th:href="@{/admin/navbar}">
                <i class="bi bi-menu-button-wide me-2"></i>
                Gestione Navbar
            </a>

            <a th:class="${activeMenu == 'footer'} ? 'nav-link active' : 'nav-link'" th:href="@{/admin/footer}">
                <i class="bi bi-border-bottom me-2"></i>
                Gestione Footer
            </a>
        </div>
    </aside>
</body>
</html>
