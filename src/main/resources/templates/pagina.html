<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${page.title}">
        Eco Skill Factory
    </title>


    <!-- =========================================================
         BOOTSTRAP
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">


    <!-- =========================================================
         BOOTSTRAP ICONS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


    <!-- =========================================================
         STILI
         ========================================================= -->

    <style>

        body {

            background: #080c14;

            color: #f1f5f9;

            min-height: 100vh;

        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar-custom {

            background: rgba(15, 23, 42, 0.95);

            border-bottom:
                1px solid rgba(255,255,255,0.1);

        }


        /* =====================================================
           CONTENITORE PAGINA
           
           La larghezza viene gestita direttamente da
           th:style utilizzando page.widthPercent.
           
           NON impostiamo più max-width: 1000px.
           ===================================================== */

        .page-container {

            margin-left: auto;

            margin-right: auto;

        }


        /* =====================================================
           BOX PAGINA
           ===================================================== */

        .page-box {

            background:
                rgba(15, 23, 42, 0.85);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 20px;

            padding: 50px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);

        }


        /* =====================================================
           TITOLO
           ===================================================== */

        .page-title {

            color: #00dc82;

            font-weight: 800;

            margin-bottom: 35px;

        }


        /* =====================================================
           CONTENUTO
           ===================================================== */

        .content-body {

            color: #cbd5e1;

            font-size: 1.05rem;

            line-height: 1.8;

        }


        .content-body h1,
        .content-body h2,
        .content-body h3 {

            color: #ffffff;

        }


        .content-body a {

            color: #00dc82;

        }


        /* =====================================================
           IMMAGINI INSERITE CON TINYMCE
           ===================================================== */

        .content-body img {

            max-width: 100%;

            height: auto;

        }


        /* =====================================================
           TABELLE
           ===================================================== */

        .content-body table {

            max-width: 100%;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 767px) {

            .page-container {

                width: 100% !important;

            }


            .page-box {

                padding: 25px;

                border-radius: 12px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
     ========================================================= -->

<nav class="navbar navbar-dark navbar-custom">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            th:href="@{/}">

            <i class="bi bi-cpu-fill text-success me-2"></i>

            Eco Skill Factory

        </a>

    </div>

</nav>



<!-- =========================================================
     PAGINA
     ========================================================= -->

<main class="container-fluid py-5">


    <!-- =====================================================
         CONTENITORE CON LARGHEZZA DINAMICA
         
         Esempi:
         
         widthPercent = 100
         → 100%
         
         widthPercent = 90
         → 90%
         
         widthPercent = 75
         → 75%
         
         widthPercent = 50
         → 50%
         
         widthPercent = 30
         → 30%
         ===================================================== -->

    <div
        class="page-container"
        th:style="'width: ' + ${page.widthPercent != null ? page.widthPercent : 100} + '%;'">


        <div class="page-box">


            <!-- =================================================
                 TITOLO
                 ================================================= -->

            <h1
                class="page-title"
                th:text="${page.title}">

                Titolo pagina

            </h1>


            <!-- =================================================
                 CONTENUTO
                 ================================================= -->

            <div
                class="content-body"
                th:if="${page.contentHtml != null
                        and !#strings.isEmpty(page.contentHtml)}"

                th:utext="${page.contentHtml}">

            </div>


            <!-- =================================================
                 NESSUN CONTENUTO
                 ================================================= -->

            <div
                th:if="${page.contentHtml == null
                        or #strings.isEmpty(page.contentHtml)}"

                class="alert alert-secondary">

                Questa pagina non contiene ancora contenuto.

            </div>


        </div>

    </div>

</main>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer
    class="text-center text-secondary py-4">

    © 2026 Eco Skill Factory

</footer>



<!-- =========================================================
     BOOTSTRAP JS
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
