<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestione Pagina - Eco Skill Factory</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- BOOTSTRAP JS IN HEAD -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            background-color: #080c14 !important;
            overflow-x: hidden;
            position: relative;
        }

        #tech-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .card, .bg-light, .alert-light {
            background-color: #0f172a !important;
            border: 1px solid #1e293b !important;
            color: #f1f5f9 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }

        label, h2, h4, h5, .form-label, .form-text, .text-muted {
            color: #cbd5e1 !important;
        }

        .form-control, .form-select {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border-color: #00dc82 !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 220, 130, 0.25) !important;
        }

        .input-group-text {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #00dc82 !important;
        }

        code {
            color: #36e4da !important;
        }

        .btn-brand {
            background: linear-gradient(135deg, #00dc82 0%, #00b368 100%);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 220, 130, 0.25);
        }

        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 220, 130, 0.4);
            color: #0f172a;
        }

        .modal-content-dark {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
        }

        /* STILI PER MONACO FULLSCREEN MODAL */

        .modal-fullscreen-custom {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .modal-fullscreen-custom .modal-content {
            height: 100vh !important;
            border-radius: 0 !important;
        }

        .modal-fullscreen-custom #monacoContainer {
            height: calc(100vh - 120px) !important;
        }

        /* =========================================================
           AGGIUNTE MONACO
           ========================================================= */

        .monaco-extra-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #111827;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
        }

        .monaco-search-wrapper {
            width: min(360px, 100%);
            flex: 1 1 260px;
        }

        .monaco-search-wrapper .input-group-text {
            background: #1e293b;
            border-color: #334155;
            color: #00dc82;
        }

        .monaco-search-input {
            min-width: 0;
            background: #0f172a !important;
            color: #ffffff !important;
            border-color: #334155 !important;
        }

        .monaco-search-input::placeholder {
            color: #94a3b8;
        }

        .monaco-zoom-label {
            min-width: 58px;
            text-align: center;
            cursor: default !important;
        }

        .monaco-editor-workspace {
            width: 100%;
            height: 550px;
            min-height: 0;
        }

        .monaco-editor-workspace #monacoContainer {
            width: 100%;
            height: 100% !important;
        }

        .modal-fullscreen-custom .monaco-editor-workspace {
            height: calc(100vh - 120px) !important;
        }

        .monaco-editor .suggest-widget,
        .monaco-editor .parameter-hints-widget {
            z-index: 10000 !important;
        }

        .monaco-search-match {
            background: rgba(255, 210, 0, 0.28);
            border-bottom: 1px solid #ffd54f;
        }

        @media (max-width: 768px) {

            .monaco-extra-toolbar {
                align-items: stretch;
            }

            .monaco-search-wrapper {
                flex-basis: 100%;
            }

        }

    </style>

    <!-- TINYMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@8.5.0/tinymce.min.js"
            referrerpolicy="origin"></script>

    <!-- MONACO LOADER & EMMET SUPPORT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/emmet-monaco-es@5.3.0/dist/emmet-monaco.min.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            tinymce.init({

                selector: '.wysiwyg-editor',

                language: 'it',

                language_url: '/tinymce/langs/it.js',

                content_language: 'it',

                min_height: 500,

                menubar: true,

                branding: false,

                promotion: false,

                license_key: 'gpl',

                statusbar: true,

                elementpath: true,

                skin: 'oxide-dark',

                image_advtab: true,

                image_title: true,

                image_caption: true,

                automatic_uploads: true,

                object_resizing: 'img',

                resize_img_proportional: true,

                relative_urls: false,

                remove_script_host: false,

                convert_urls: false,

                document_base_url: window.location.origin + '/',

                font_size_formats:
                    '12px 14px 16px 18px 20px 24px 28px 32px 36px 48px',

                font_size_input_default_unit: 'px',

                plugins: [
                    'advlist',
                    'autolink',
                    'lists',
                    'link',
                    'image',
                    'charmap',
                    'anchor',
                    'searchreplace',
                    'visualblocks',
                    'code',
                    'fullscreen',
                    'media',
                    'table',
                    'wordcount',
                    'help',
                    'emoticons'
                ],

                toolbar:
                    'undo redo | blocks fontfamily fontsize | ' +
                    'bold italic underline | ' +
                    'forecolor backcolor | ' +
                    'alignleft aligncenter alignright alignjustify | ' +
                    'bullist numlist | ' +
                    'link image media table emoticons | ' +
                    'code fullscreen | help',

                content_style: `
                    body {
                        font-family: Arial, sans-serif;
                        font-size: 18px;
                        line-height: 1.6;
                        background-color: #0d1b2a !important;
                        color: #ffffff !important;
                        padding: 15px;
                    }

                    p {
                        font-size: 18px;
                        color: #ffffff !important;
                    }

                    h1, h2, h3, h4, h5, h6 {
                        color: #ffffff !important;
                    }

                    a {
                        color: #36e4da !important;
                    }

                    img {
                        max-width: 100%;
                        height: auto;
                    }

                    figure.image.align-left {
                        float: left;
                        margin: 0 15px 10px 0;
                    }

                    figure.image.align-center {
                        display: block;
                        text-align: center;
                        margin: 10px auto;
                    }

                    figure.image.align-right {
                        float: right;
                        margin: 0 0 10px 15px;
                    }

                    figure.image {
                        display: inline-block;
                        margin: 0 2px 0 1px;
                    }

                    figure.image img {
                        max-width: 100%;
                        height: auto;
                    }
                `,

                style_formats: [

                    {
                        title: 'Immagine a sinistra',
                        selector: 'img',
                        styles: {
                            'float': 'left',
                            'margin': '0 15px 10px 0'
                        }
                    },

                    {
                        title: 'Immagine centrata',
                        selector: 'img',
                        styles: {
                            'display': 'block',
                            'float': 'none',
                            'margin-left': 'auto',
                            'margin-right': 'auto'
                        }
                    },

                    {
                        title: 'Immagine a destra',
                        selector: 'img',
                        styles: {
                            'float': 'right',
                            'margin': '0 0 10px 15px'
                        }
                    },

                    {
                        title: 'Immagine normale',
                        selector: 'img',
                        styles: {
                            'float': 'none',
                            'display': 'inline',
                            'margin': '0'
                        }
                    }

                ],

                images_upload_handler:
                    (blobInfo) => new Promise((resolve, reject) => {

                        const formData =
                            new FormData();

                        formData.append(
                            'file',
                            blobInfo.blob(),
                            blobInfo.filename()
                        );

                        fetch(
                            '/api/uploads/immagine',
                            {
                                method: 'POST',
                                body: formData
                            }
                        )

                        .then(response => {

                            if (!response.ok) {

                                return response
                                    .text()
                                    .then(text => {

                                        throw new Error(
                                            'Errore HTTP ' +
                                            response.status +
                                            ': ' +
                                            text
                                        );

                                    });

                            }

                            return response.json();

                        })

                        .then(data => {

                            const imageUrl =
                                data.location ||
                                data.url;

                            if (!imageUrl) {

                                throw new Error(
                                    'Il server non ha restituito location oppure url.'
                                );

                            }

                            resolve(imageUrl);

                        })

                        .catch(error => {

                            console.error(
                                'Upload fallito:',
                                error
                            );

                            reject({
                                message:
                                    'Caricamento immagine non riuscito: ' +
                                    error.message,
                                remove: true
                            });

                        });

                    })

            });

        });

    </script>

</head>

<body>

    <canvas id="tech-bg-canvas"></canvas>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1"
                    th:text="${page.id == null ? 'Nuova Pagina' : 'Modifica Pagina #' + page.id}">
                    Nuova Pagina
                </h2>

                <p class="text-muted mb-0">
                    Crea o modifica il contenuto della pagina.
                </p>

            </div>

            <a th:href="@{/admin/pages}"
               class="btn btn-outline-light">

                <i class="bi bi-arrow-left me-1"></i>
                Torna alla Gestione Pagine

            </a>

        </div>

        <form id="pageForm"
              th:action="@{/admin/pages/save}"
              th:object="${page}"
              method="post"
              class="card shadow-sm border-0"
              novalidate>

            <div class="card-body p-4">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Titolo Pagina
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{title}"
                           class="form-control form-control-lg"
                           placeholder="es. Chi Siamo"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Slug URL
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{slug}"
                           class="form-control"
                           placeholder="es. chi-siamo"
                           required>

                </div>

                <div class="mb-4">

                    <label for="widthPercent"
                           class="form-label fw-bold">

                        Larghezza Blocco (%)

                    </label>

                    <div class="input-group">

                        <input id="widthPercent"
                               type="number"
                               th:field="*{widthPercent}"
                               class="form-control"
                               min="10"
                               max="100"
                               step="1"
                               placeholder="100">

                        <span class="input-group-text">
                            %
                        </span>

                    </div>

                </div>

                <div class="mb-4">

                    <div class="d-flex justify-content-between align-items-center mb-2">

                        <label class="form-label fw-bold mb-0">
                            Contenuto HTML (TinyMCE)
                        </label>

                        <button type="button"
                                class="btn btn-outline-info btn-sm"
                                onclick="openMonacoModal()">

                            <i class="bi bi-code-slash me-1"></i>
                            Apri Monaco Editor

                        </button>

                    </div>

                    <textarea id="pageContentHtml"
                              th:field="*{contentHtml}"
                              class="form-control wysiwyg-editor"
                              rows="15">
                    </textarea>

                </div>

                <div class="text-end">

                    <button type="submit"
                            class="btn btn-brand btn-lg px-4">

                        <i class="bi bi-save me-1"></i>
                        Salva Pagina

                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- MODALE MONACO EDITOR AVANZATO -->
    <div class="modal fade"
         id="monacoEditorModal"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered"
             id="monacoModalDialog">

            <div class="modal-content modal-content-dark">

                <div class="modal-header border-bottom border-info d-flex justify-content-between align-items-center">

                    <h5 class="modal-title fw-bold text-white mb-0">

                        <i class="bi bi-code-square text-info me-2"></i>

                        Monaco Code Editor

                        <small class="text-muted fs-6 ms-2">
                            (Emmet abilitato - Premi TAB)
                        </small>

                    </h5>

                    <div>

                        <button type="button"
                                class="btn btn-sm btn-outline-light me-2"
                                onclick="toggleMonacoFullscreen()"
                                id="btnToggleFullscreen"
                                title="Schermo Intero">

                            <i class="bi bi-arrows-angle-expand"
                               id="fullscreenIcon"></i>

                            Schermo Intero

                        </button>

                        <button type="button"
                                class="btn-close btn-close-white"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>

                    </div>

                </div>

                <div class="modal-body p-0">

                    <!-- AGGIUNTE: STRUMENTI MONACO -->

                    <div class="monaco-extra-toolbar">

                        <div class="input-group input-group-sm monaco-search-wrapper">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input type="text"
                                   id="monacoSearchInput"
                                   class="form-control monaco-search-input"
                                   placeholder="Cerca nel codice..."
                                   autocomplete="off"
                                   aria-label="Cerca nel codice">

                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="btnMonacoSearchClear"
                                    title="Cancella ricerca">

                                <i class="bi bi-x-lg"></i>

                            </button>

                        </div>

                        <div class="btn-group btn-group-sm"
                             role="group"
                             aria-label="Zoom editor">

                            <button type="button"
                                    class="btn btn-outline-light"
                                    onclick="changeMonacoFontSize(-1)"
                                    title="Riduci testo">

                                <i class="bi bi-zoom-out"></i>

                            </button>

                            <span class="btn btn-outline-secondary monaco-zoom-label"
                                  id="monacoZoomLabel">

                                100%

                            </span>

                            <button type="button"
                                    class="btn btn-outline-light"
                                    onclick="changeMonacoFontSize(1)"
                                    title="Ingrandisci testo">

                                <i class="bi bi-zoom-in"></i>

                            </button>

                        </div>

                        <!-- SOLO LA MINIMAPPA DI MONACO -->

                        <button type="button"
                                class="btn btn-sm btn-outline-warning"
                                id="btnTogglePreview"
                                onclick="toggleMonacoPreview()"
                                title="Nascondi minimappa a destra">

                            <i class="bi bi-map me-1"
                               id="previewIcon"></i>

                            <span id="previewButtonText">
                                Nascondi minimappa
                            </span>

                        </button>

                    </div>

                    <div id="monacoWorkspace"
                         class="monaco-editor-workspace">

                        <div id="monacoContainer"
                             style="width:100%; height:550px;">
                        </div>

                    </div>

                </div>

                <div class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-between">

                    <div class="text-muted small">

                        <span class="badge bg-secondary me-1">
                            Emmet
                        </span>

                        Usa scorciatoie come
                        <code>ul>li*3>a</code> + TAB

                    </div>

                    <div>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">

                            Annulla

                        </button>

                        <button type="button"
                                class="btn btn-info"
                                onclick="saveMonacoContent()">

                            Applica Modifiche

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        let windowMonacoEditor = null;

        require.config({
            paths: {
                vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs'
            }
        });

        function openMonacoModal() {

            let currentContent =
                tinymce.get('pageContentHtml')
                    ? tinymce.get('pageContentHtml').getContent()
                    : document.getElementById('pageContentHtml').value;

            const modalEl =
                document.getElementById(
                    'monacoEditorModal'
                );

            const modal =
                new bootstrap.Modal(
                    modalEl
                );

            modal.show();

            modalEl.addEventListener(
                'shown.bs.modal',
                function () {

                    if (!windowMonacoEditor) {

                        require(
                            ['vs/editor/editor.main'],
                            function () {

                                // Inizializzazione Emmet per Monaco

                                if (window.emmetMonaco) {

                                    window.emmetMonaco.emmetHTML(
                                        monaco
                                    );

                                }

                                windowMonacoEditor =
                                    monaco.editor.create(
                                        document.getElementById(
                                            'monacoContainer'
                                        ),
                                        {
                                            value: currentContent,
                                            language: 'html',
                                            theme: 'vs-dark',
                                            automaticLayout: true,
                                            autoClosingTags: true,
                                            suggestOnTriggerCharacters: true,
                                            formatOnPaste: true,
                                            formatOnType: true,

                                            suggest: {
                                                showWords: true,
                                                showSnippets: true,
                                                showHtml5: true
                                            },

                                            quickSuggestions: {
                                                other: true,
                                                comments: true,
                                                strings: true
                                            }
                                        }
                                    );

                            }
                        );

                    } else {

                        windowMonacoEditor.setValue(
                            currentContent
                        );

                    }

                },
                {
                    once: true
                }
            );

        }

        function toggleMonacoFullscreen() {

            const dialog =
                document.getElementById(
                    'monacoModalDialog'
                );

            const icon =
                document.getElementById(
                    'fullscreenIcon'
                );

            const btn =
                document.getElementById(
                    'btnToggleFullscreen'
                );

            dialog.classList.toggle(
                'modal-fullscreen-custom'
            );

            if (
                dialog.classList.contains(
                    'modal-fullscreen-custom'
                )
            ) {

                icon.className =
                    'bi bi-arrows-angle-contract';

                btn.classList.replace(
                    'btn-outline-light',
                    'btn-warning'
                );

            } else {

                icon.className =
                    'bi bi-arrows-angle-expand';

                btn.classList.replace(
                    'btn-warning',
                    'btn-outline-light'
                );

            }

            if (windowMonacoEditor) {

                setTimeout(
                    () => windowMonacoEditor.layout(),
                    150
                );

            }

        }

        function saveMonacoContent() {

            if (windowMonacoEditor) {

                const code =
                    windowMonacoEditor.getValue();

                if (
                    tinymce.get(
                        'pageContentHtml'
                    )
                ) {

                    tinymce
                        .get('pageContentHtml')
                        .setContent(code);

                }

                document.getElementById(
                    'pageContentHtml'
                ).value = code;

            }

            const modalEl =
                document.getElementById(
                    'monacoEditorModal'
                );

            const modal =
                bootstrap.Modal.getInstance(
                    modalEl
                );

            if (modal) {
                modal.hide();
            }

        }

    </script>

    <!-- ============================================================
         AGGIUNTE MONACO
         ============================================================ -->

    <script>

        (function () {

            let monacoFontSize = 14;

            let monacoPreviewVisible = true;

            let monacoSearchMatches = [];

            let monacoSearchIndex = -1;

            let monacoSearchDecorations = [];

            let monacoSuggestObserver = null;

            function getEditor() {

                return windowMonacoEditor || null;

            }

            function updateZoomLabel() {

                const label =
                    document.getElementById(
                        'monacoZoomLabel'
                    );

                if (label) {

                    label.textContent =
                        Math.round(
                            (monacoFontSize / 14) * 100
                        ) + '%';

                }

            }

            window.changeMonacoFontSize =
                function (direction) {

                    const editor =
                        getEditor();

                    if (!editor) {
                        return;
                    }

                    monacoFontSize += direction;

                    monacoFontSize =
                        Math.max(
                            8,
                            Math.min(
                                32,
                                monacoFontSize
                            )
                        );

                    editor.updateOptions({
                        fontSize:
                            monacoFontSize
                    });

                    updateZoomLabel();

                };

            function updatePreviewButton() {

                const button =
                    document.getElementById(
                        'btnTogglePreview'
                    );

                const icon =
                    document.getElementById(
                        'previewIcon'
                    );

                const text =
                    document.getElementById(
                        'previewButtonText'
                    );

                if (!button || !icon || !text) {
                    return;
                }

                if (monacoPreviewVisible) {

                    icon.className =
                        'bi bi-map me-1';

                    text.textContent =
                        'Nascondi minimappa';

                    button.title =
                        'Nascondi minimappa a destra';

                } else {

                    icon.className =
                        'bi bi-map-fill me-1';

                    text.textContent =
                        'Mostra minimappa';

                    button.title =
                        'Mostra minimappa a destra';

                }

            }

            window.toggleMonacoPreview =
                function () {

                    const editor =
                        getEditor();

                    if (!editor) {
                        return;
                    }

                    monacoPreviewVisible =
                        !monacoPreviewVisible;

                    editor.updateOptions({

                        minimap: {

                            enabled:
                                monacoPreviewVisible,

                            side: 'right',

                            renderCharacters: false

                        },

                        fixedOverflowWidgets: true

                    });

                    setTimeout(
                        function () {

                            editor.layout();

                        },
                        80
                    );

                    updatePreviewButton();

                };

            function searchMonaco(query) {

                const editor =
                    getEditor();

                if (!editor) {
                    return;
                }

                monacoSearchDecorations =
                    editor.deltaDecorations(
                        monacoSearchDecorations,
                        []
                    );

                monacoSearchMatches = [];

                monacoSearchIndex = -1;

                if (!query) {
                    return;
                }

                monacoSearchMatches =
                    editor
                        .getModel()
                        .findMatches(
                            query,
                            true,
                            false,
                            false,
                            null,
                            true
                        );

                monacoSearchDecorations =
                    editor.deltaDecorations(
                        [],
                        monacoSearchMatches.map(
                            function (match) {

                                return {

                                    range: match.range,

                                    options: {

                                        inlineClassName:
                                            'monaco-search-match'

                                    }

                                };

                            }
                        )
                    );

                if (
                    monacoSearchMatches.length
                ) {

                    monacoSearchIndex = 0;

                    selectMonacoSearchMatch();

                }

            }

            function selectMonacoSearchMatch() {

                const editor =
                    getEditor();

                if (
                    !editor ||
                    monacoSearchIndex < 0 ||
                    monacoSearchIndex >=
                        monacoSearchMatches.length
                ) {
                    return;
                }

                const match =
                    monacoSearchMatches[
                        monacoSearchIndex
                    ];

                editor.setSelection(
                    match.range
                );

                editor.revealRangeInCenter(
                    match.range
                );

                editor.focus();

            }

            function nextMonacoSearchMatch(
                direction
            ) {

                if (
                    !monacoSearchMatches.length
                ) {
                    return;
                }

                monacoSearchIndex +=
                    direction;

                if (
                    monacoSearchIndex >=
                    monacoSearchMatches.length
                ) {

                    monacoSearchIndex = 0;

                }

                if (
                    monacoSearchIndex < 0
                ) {

                    monacoSearchIndex =
                        monacoSearchMatches.length -
                        1;

                }

                selectMonacoSearchMatch();

            }

            function setupMonacoSearch() {

                const input =
                    document.getElementById(
                        'monacoSearchInput'
                    );

                const clear =
                    document.getElementById(
                        'btnMonacoSearchClear'
                    );

                if (!input || !clear) {
                    return;
                }

                if (
                    input.dataset.monacoReady ===
                    'true'
                ) {
                    return;
                }

                input.dataset.monacoReady =
                    'true';

                input.addEventListener(
                    'input',
                    function () {

                        searchMonaco(
                            input.value
                        );

                    }
                );

                input.addEventListener(
                    'keydown',
                    function (event) {

                        if (
                            event.key ===
                            'Enter'
                        ) {

                            event.preventDefault();

                            nextMonacoSearchMatch(
                                event.shiftKey
                                    ? -1
                                    : 1
                            );

                        }

                        if (
                            event.key ===
                            'Escape'
                        ) {

                            event.preventDefault();

                            input.value = '';

                            searchMonaco('');

                            const editor =
                                getEditor();

                            if (editor) {
                                editor.focus();
                            }

                        }

                    }
                );

                clear.addEventListener(
                    'click',
                    function () {

                        input.value = '';

                        searchMonaco('');

                        const editor =
                            getEditor();

                        if (editor) {
                            editor.focus();
                        }

                    }
                );

            }

            /*
             * FORZA LA MINIMAPPA DOPO IL RIDIMENSIONAMENTO
             * DELLA MODALE.
             */
            function forceMonacoMinimapAndLayout() {

                const editor =
                    getEditor();

                if (!editor) {
                    return;
                }

                editor.updateOptions({

                    minimap: {

                        enabled:
                            monacoPreviewVisible,

                        side: 'right',

                        renderCharacters: false

                    },

                    fixedOverflowWidgets: true

                });

                setTimeout(
                    function () {
                        editor.layout();
                    },
                    0
                );

                setTimeout(
                    function () {
                        editor.layout();
                    },
                    150
                );

                setTimeout(
                    function () {
                        editor.layout();
                    },
                    400
                );

            }

            /*
             * FORZA I SUGGERIMENTI SOTTO IL CURSORE.
             */
            function setupSuggestionPositioning() {

                const editor =
                    getEditor();

                if (!editor) {
                    return;
                }

                if (monacoSuggestObserver) {

                    monacoSuggestObserver.disconnect();

                }

                function repositionSuggestions() {

                    const widget =
                        document.querySelector(
                            '.monaco-editor .suggest-widget'
                        );

                    if (!widget) {
                        return;
                    }

                    if (
                        widget.offsetParent ===
                        null
                    ) {
                        return;
                    }

                    const position =
                        editor.getPosition();

                    if (!position) {
                        return;
                    }

                    const cursor =
                        editor.getScrolledVisiblePosition(
                            position
                        );

                    if (!cursor) {
                        return;
                    }

                    const container =
                        document.getElementById(
                            'monacoContainer'
                        );

                    if (!container) {
                        return;
                    }

                    const containerRect =
                        container.getBoundingClientRect();

                    const top =
                        containerRect.top +
                        cursor.top +
                        cursor.height +
                        4;

                    const left =
                        containerRect.left +
                        cursor.left;

                    widget.style.position =
                        'fixed';

                    widget.style.left =
                        Math.max(
                            8,
                            left
                        ) + 'px';

                    widget.style.top =
                        top + 'px';

                    widget.style.bottom =
                        'auto';

                    const availableHeight =
                        Math.max(
                            120,
                            window.innerHeight -
                            top -
                            8
                        );

                    widget.style.maxHeight =
                        availableHeight + 'px';

                }

                monacoSuggestObserver =
                    new MutationObserver(
                        function () {

                            setTimeout(
                                repositionSuggestions,
                                0
                            );

                        }
                    );

                monacoSuggestObserver.observe(
                    document.body,
                    {
                        subtree: true,
                        attributes: true,
                        attributeFilter: [
                            'class',
                            'style'
                        ]
                    }
                );

                editor.onDidChangeCursorPosition(
                    function () {

                        setTimeout(
                            repositionSuggestions,
                            0
                        );

                    }
                );

                editor.onDidChangeModelContent(
                    function () {

                        setTimeout(
                            repositionSuggestions,
                            0
                        );

                    }
                );

                window.addEventListener(
                    'resize',
                    function () {

                        setTimeout(
                            repositionSuggestions,
                            0
                        );

                    }
                );

            }

            function setupMonacoExtras() {

                const editor =
                    getEditor();

                if (!editor) {
                    return false;
                }

                updateZoomLabel();

                updatePreviewButton();

                setupMonacoSearch();

                setupSuggestionPositioning();

                forceMonacoMinimapAndLayout();

                return true;

            }

            /*
             * Aspetta che il Monaco originale venga creato.
             */
            const setupTimer =
                setInterval(
                    function () {

                        if (
                            setupMonacoExtras()
                        ) {

                            clearInterval(
                                setupTimer
                            );

                        }

                    },
                    100
                );

            /*
             * FIX FULLSCREEN:
             *
             * osserviamo il cambio della classe del dialog
             * originale e ridisegniamo Monaco.
             */
            const dialog =
                document.getElementById(
                    'monacoModalDialog'
                );

            if (dialog) {

                const fullscreenObserver =
                    new MutationObserver(
                        function () {

                            setTimeout(
                                forceMonacoMinimapAndLayout,
                                30
                            );

                            setTimeout(
                                forceMonacoMinimapAndLayout,
                                200
                            );

                            setTimeout(
                                forceMonacoMinimapAndLayout,
                                600
                            );

                        }
                    );

                fullscreenObserver.observe(
                    dialog,
                    {
                        attributes: true,
                        attributeFilter: [
                            'class'
                        ]
                    }
                );

            }

            const modal =
                document.getElementById(
                    'monacoEditorModal'
                );

            if (modal) {

                modal.addEventListener(
                    'shown.bs.modal',
                    function () {

                        setTimeout(
                            function () {

                                setupMonacoExtras();

                                forceMonacoMinimapAndLayout();

                            },
                            50
                        );

                        setTimeout(
                            function () {

                                setupMonacoExtras();

                                forceMonacoMinimapAndLayout();

                            },
                            300
                        );

                    }
                );

            }

        })();

    </script>

</body>
