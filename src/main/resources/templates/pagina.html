<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${page.title}">
        Eco Skill Factory
    </title>


    <!-- ========================================================
         GOOGLE FONTS
         ======================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">


    <!-- ========================================================
         BOOTSTRAP
         ======================================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">


    <!-- ========================================================
         BOOTSTRAP ICONS
         ======================================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


    <!-- ========================================================
         STILI
         ======================================================== -->

    <style>

        :root {

            --brand-primary: #00dc82;

            --brand-primary-hover: #00b368;

            --brand-dark: #0f172a;

        }


        /* =====================================================
           BODY
           ===================================================== */

        body {

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            background: #080c14;

            color: #f1f5f9;

            min-height: 100vh;

            overflow-x: hidden;

            position: relative;

        }


        /* =====================================================
           SFONDO TECNOLOGICO
           ===================================================== */

        #tech-bg-canvas {

            position: fixed;

            top: 0;

            left: 0;

            width: 100vw;

            height: 100vh;

            z-index: -1;

            pointer-events: none;

        }


        /* =====================================================
           NAVBAR GLASS
           ===================================================== */

        .glass-header {

            background:
                rgba(15, 23, 42, 0.75) !important;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);

        }


        /* =====================================================
           BRAND
           ===================================================== */

        .brand-text {

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #cbd5e1 100%
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            letter-spacing: -0.5px;

        }


        .brand-accent {

            background:
                linear-gradient(
                    135deg,
                    #00dc82 0%,
                    #36e4da 100%
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        /* =====================================================
           NAVBAR LINK
           ===================================================== */

        .navbar-nav .nav-link {

            position: relative;

            transition:
                color 0.3s ease,
                transform 0.2s ease;

            font-weight: 500;

        }


        .navbar-nav .nav-link::after {

            content: '';

            position: absolute;

            bottom: 0;

            left: 50%;

            width: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    #00dc82,
                    #36e4da
                );

            transition:
                width 0.3s ease,
                left 0.3s ease;

            border-radius: 2px;

        }


        .navbar-nav .nav-link:hover {

            color: #00dc82 !important;

            opacity: 1 !important;

            transform:
                translateY(-1px);

        }


        .navbar-nav .nav-link:hover::after {

            width: 80%;

            left: 10%;

        }


        /* =====================================================
           DROPDOWN
           ===================================================== */

        .dropdown-menu-dark .dropdown-item {

            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                padding-left 0.25s ease;

            border-radius:
                0.375rem;

        }


        .dropdown-menu-dark .dropdown-item:hover {

            background-color:
                rgba(0, 220, 130, 0.15) !important;

            color:
                #00dc82 !important;

            padding-left:
                1.5rem;

        }


        /* =====================================================
           PAGE CONTAINER
           ===================================================== */

        .page-container {

            margin-left: auto;

            margin-right: auto;

        }


        /* =====================================================
           PAGE BOX
           ===================================================== */

        .page-box {

            background: transparent;

            border: none;

            border-radius: 0;

            padding: 0;

            box-shadow: none;

            backdrop-filter: none;

            -webkit-backdrop-filter: none;

        }


        /* =====================================================
           PAGE TITLE
           ===================================================== */

        .page-title {

            color:
                #00dc82;

            font-weight:
                800;

            margin-bottom:
                35px;

        }


        /* =====================================================
           CONTENT BODY
           ===================================================== */

        .content-body {

            color:
                #cbd5e1;

            font-size:
                1.05rem;

            line-height:
                1.8;

        }


        .content-body h1,
        .content-body h2,
        .content-body h3,
        .content-body h4,
        .content-body h5,
        .content-body h6 {

            color:
                #ffffff;

        }


        .content-body p {

            margin-bottom:
                1rem;

        }


        .content-body a {

            color:
                #00dc82;

            text-decoration:
                none;

            transition:
                color 0.25s ease;

        }


        .content-body a:hover {

            color:
                #36e4da;

            text-decoration:
                underline;

        }


        /* =====================================================
           LISTE
           ===================================================== */

        .content-body ul,
        .content-body ol {

            padding-left:
                1.5rem;

        }


        .content-body li {

            margin-bottom:
                0.5rem;

        }


        /* =====================================================
           IMMAGINI
           ===================================================== */

        .content-body img {

            max-width:
                100%;

            height:
                auto;

            border-radius:
                10px;

        }


        /* =====================================================
           TABELLE
           ===================================================== */

        .content-body table {

            max-width:
                100%;

            width:
                100%;

            color:
                #cbd5e1;

        }


        .content-body table th {

            color:
                #ffffff;

        }


        /* =====================================================
           CODE
           ===================================================== */

        .content-body code {

            color:
                #36e4da;

            background:
                rgba(0, 220, 130, 0.08);

            padding:
                0.15rem 0.35rem;

            border-radius:
                4px;

        }


        .content-body pre {

            background:
                #020617;

            color:
                #cbd5e1;

            padding:
                1rem;

            border-radius:
                10px;

            overflow-x:
                auto;

            border:
                1px solid rgba(255,255,255,0.08);

        }


        /* =====================================================
           BLOCKQUOTE
           ===================================================== */

        .content-body blockquote {

            border-left:
                3px solid #00dc82;

            padding-left:
                1rem;

            color:
                #94a3b8;

        }


        /* =====================================================
           ALERT
           ===================================================== */

        .empty-content {

            background:
                rgba(71, 85, 105, 0.25);

            border:
                1px solid rgba(148, 163, 184, 0.2);

            color:
                #cbd5e1;

            border-radius:
                12px;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .page-footer {

            background:
                rgba(15, 23, 42, 0.85);

            border-top:
                1px solid rgba(255,255,255,0.08);

        }


        /* =====================================================
           BOTTONE TORNA SU
           ===================================================== */

        .btn-back-to-top {

            position: fixed;

            bottom: 30px;

            right: 30px;

            width: 48px;

            height: 48px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #00dc82 0%,
                #00b368 100%
            );

            color: #0f172a;

            border: none;

            outline: none;

            box-shadow: 0 4px 15px rgba(0, 220, 130, 0.4);

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.5rem;

            z-index: 9999;

            opacity: 0;

            visibility: hidden;

            transform: translateY(20px);

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        .btn-back-to-top.show {

            opacity: 1;

            visibility: visible;

            transform: translateY(0);

        }


        .btn-back-to-top:hover {

            transform: translateY(-3px);

            box-shadow: 0 6px 20px rgba(0, 220, 130, 0.6);

            color: #0f172a;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 767.98px) {

            .page-container {

                width:
                    100% !important;

            }


            .page-box {

                padding: 0;

                border-radius: 0;

            }


            .page-title {

                font-size:
                    1.8rem;

                margin-bottom:
                    25px;

            }


            .content-body {

                font-size:
                    1rem;

                line-height:
                    1.7;

            }


            .navbar-brand {

                font-size:
                    1rem !important;

            }


            .navbar-brand .fs-3 {

                font-size:
                    1.5rem !important;

            }


            .navbar-nav {

                padding-top:
                    1rem;

            }


            .navbar-nav .nav-link::after {

                display:
                    none;

            }


            .dropdown-menu {

                margin-top:
                    0.5rem;

            }

            .btn-back-to-top {

                bottom: 20px;

                right: 20px;

                width: 42px;

                height: 42px;

                font-size: 1.3rem;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     SFONDO ANIMATO
     ========================================================= -->

<canvas id="tech-bg-canvas"></canvas>


<!-- =========================================================
     NAVBAR CONDIVISA
     ========================================================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- =========================================================
     PAGINA
     ========================================================= -->

<main class="container-fluid py-5">

    <div class="page-container"

         th:style="'width: ' +
                   ${page.widthPercent != null
                       ? page.widthPercent
                       : 100}
                   + '%;'">


        <div class="page-box">


            <!-- =================================================
                 TITOLO
                 ================================================= -->

            <h1 class="page-title"
                th:text="${page.title}">

                Titolo pagina

            </h1>


            <!-- =================================================
                 CONTENUTO
                 ================================================= -->

            <div class="content-body"

                 th:if="${page.contentHtml != null
                         and !#strings.isEmpty(page.contentHtml)}"

                 th:utext="${page.contentHtml}">

            </div>


            <!-- =================================================
                 NESSUN CONTENUTO
                 ================================================= -->

            <div th:if="${page.contentHtml == null
                         or #strings.isEmpty(page.contentHtml)}"

                 class="alert empty-content">

                <i class="bi bi-info-circle me-2"></i>

                Questa pagina non contiene ancora contenuto.

            </div>

        </div>

    </div>

</main>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="page-footer text-center text-secondary py-4 mt-auto">

    <div class="container">

        <p class="mb-0 small">

            &copy; 2026 Eco Skill Factory.
            Tutti i diritti riservati.

        </p>

    </div>

</footer>


<!-- =========================================================
     BOTTONE TORNA SU
     ========================================================= -->

<button type="button"
        id="btn-back-to-top"
        class="btn-back-to-top"
        aria-label="Torna su">

    <i class="bi bi-arrow-up"></i>

</button>


<!-- =========================================================
     BOOTSTRAP JS
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =========================================================
     SFONDO ANIMATO & SCRIPTS
     ========================================================= -->

<script>

    /* ========================================================
       TORNA SU SCRIPT
       ======================================================== */

    const backToTopBtn =
        document.getElementById('btn-back-to-top');


    if (backToTopBtn) {

        window.addEventListener('scroll', () => {

            if (window.scrollY > 300) {

                backToTopBtn.classList.add('show');

            } else {

                backToTopBtn.classList.remove('show');

            }

        });


        backToTopBtn.addEventListener('click', () => {

            window.scrollTo({

                top: 0,

                behavior: 'smooth'

            });

        });

    }


    /* ========================================================
       SFONDO ANIMATO
       ======================================================== */

    const canvas =
        document.getElementById('tech-bg-canvas');

    const ctx =
        canvas.getContext('2d');


    let width;
    let height;


    function resize() {

        width =
            canvas.width =
            window.innerWidth;

        height =
            canvas.height =
            window.innerHeight;

    }


    window.addEventListener(
        'resize',
        resize
    );


    resize();


    /* ========================================================
       CIRCUIT
       ======================================================== */

    class Circuit {

        constructor() {

            this.reset();

        }


        reset() {

            this.x =
                Math.random() * width;

            this.y =
                Math.random() * height;

            this.length =
                Math.floor(
                    Math.random() * 8
                ) + 4;

            this.currentStep = 0;

            this.dir =
                Math.floor(
                    Math.random() * 4
                );

            this.path = [
                {
                    x: this.x,
                    y: this.y
                }
            ];

            this.speed =
                Math.random() * 1.5 + 0.5;

            this.alpha =
                Math.random() * 0.4 + 0.1;

            this.size = 20;

        }


        update() {

            if (this.currentStep < this.length) {

                let last =
                    this.path[
                        this.path.length - 1
                    ];

                let nx = last.x;
                let ny = last.y;


                if (Math.random() < 0.3) {

                    this.dir =
                        (
                            this.dir +
                            (
                                Math.random() < 0.5
                                    ? 1
                                    : 3
                            )
                        ) % 4;

                }


                switch (this.dir) {

                    case 0:
                        ny -= this.size;
                        break;

                    case 1:
                        nx += this.size;
                        break;

                    case 2:
                        ny += this.size;
                        break;

                    case 3:
                        nx -= this.size;
                        break;

                }


                this.path.push({
                    x: nx,
                    y: ny
                });

                this.currentStep++;

            } else {

                this.alpha -= 0.005;

                if (this.alpha <= 0) {
                    this.reset();
                }

            }

        }


        draw() {

            if (this.path.length < 2) {
                return;
            }


            ctx.beginPath();

            ctx.moveTo(
                this.path[0].x,
                this.path[0].y
            );


            for (
                let i = 1;
                i < this.path.length;
                i++
            ) {

                ctx.lineTo(
                    this.path[i].x,
                    this.path[i].y
                );

            }


            ctx.strokeStyle =
                `rgba(0, 220, 130, ${this.alpha})`;

            ctx.lineWidth = 1.5;

            ctx.stroke();


            let last =
                this.path[
                    this.path.length - 1
                ];


            ctx.beginPath();

            ctx.arc(
                last.x,
                last.y,
                3,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(54, 228, 218, ${this.alpha + 0.2})`;

            ctx.fill();

        }

    }


    /* ========================================================
       CODE TEXT
       ======================================================== */

    const codeSnippets = [

        "class BlockManager {}",
        "import spring.boot.*;",
        "<div class='eco'>",
        "SELECT * FROM blocks;",
        "const init = () => {};",
        "return new PageBlock();",
        "01000101 01000011 01001111",
        "public static void main()",
        "async fetch('/api')",
        "npm run build",
        "docker-compose up -d",
        "mvn clean install"

    ];


    class CodeText {

        constructor() {

            this.reset();

        }


        reset() {

            this.x =
                Math.random()
                * (width - 200);

            this.y =
                Math.random()
                * height;

            this.text =
                codeSnippets[
                    Math.floor(
                        Math.random()
                        * codeSnippets.length
                    )
                ];

            this.alpha = 0;

            this.maxAlpha =
                Math.random() * 0.3 + 0.1;

            this.fadeIn = true;

            this.speed =
                Math.random() * 0.3 + 0.1;

        }


        update() {

            this.y -= this.speed;


            if (this.fadeIn) {

                this.alpha += 0.008;

                if (
                    this.alpha >=
                    this.maxAlpha
                ) {

                    this.fadeIn = false;

                }

            } else {

                this.alpha -= 0.005;

                if (this.alpha <= 0) {

                    this.reset();

                }

            }

        }


        draw() {

            ctx.font =
                '12px "Fira Code", monospace';

            ctx.fillStyle =
                `rgba(0, 220, 130, ${this.alpha})`;

            ctx.fillText(
                this.text,
                this.x,
                this.y
            );

        }

    }


    /* ========================================================
       OGGETTI
       ======================================================== */

    const circuits =
        Array.from(
            {
                length: 18
            },
            () => new Circuit()
        );


    const codeTexts =
        Array.from(
            {
                length: 12
            },
            () => new CodeText()
        );


    /* ========================================================
       ANIMAZIONE
       ======================================================== */

    function animate() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        circuits.forEach(
            c => {

                c.update();

                c.draw();

            }
        );


        codeTexts.forEach(
            ct => {

                ct.update();

                ct.draw();

            }
        );


        requestAnimationFrame(
            animate
        );

    }


    animate();

</script>


</body>

</html>
