spring.application.name=ifp-network

# Configurazione MySQL (Allineata a Docker Compose)
spring.datasource.url=jdbc:mysql://mysql:3306/ifp_network_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Upload Immagini e File
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Percorso Cartella Upload (Allineato al volume Docker /app/uploads/)
app.upload.dir=/app/uploads/

# Gestione Header di Inoltro (Forwarded Headers per Nginx / Proxy)
server.forward-headers-strategy=framework

# Porta Server (Allineata a Docker Compose)
server.port=8097

# Server SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mirko.onorato@gmail.com
spring.mail.password=qetq uxfq uqpc opuc

# Autenticazione e sicurezza SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true