<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor Riga - Eco Skill Factory</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #f1f5f9;
            background-color: #080c14 !important;
            overflow-x: hidden;
            position: relative;
        }

        #tech-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* FIX CSS: Limitiamo lo stile dark alle card dell'editor senza sovrascrivere l'anteprima */
        .editor-workspace-layout .card,
        .bg-light,
        .bg-white {
            background-color: #0f172a !important;
            border: 1px solid #1e293b !important;
            color: #f1f5f9 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }

        label,
        h2,
        h4,
        h5,
        .form-label,
        .form-text,
        .text-muted,
        .card-title {
            color: #cbd5e1 !important;
        }

        .form-control,
        .form-select {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border-color: #00dc82 !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 220, 130, 0.25) !important;
        }

        code {
            color: #36e4da !important;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-control-color {
            max-width: 50px;
            height: 38px;
            padding: 4px;
            cursor: pointer;
        }

        /* LAYOUT WORKSPACE */
        .editor-workspace-layout {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .live-preview-container-column {
            flex: 1 1 80%;
            min-width: 0;
            position: sticky;
            top: 1.5rem;
        }

        .sidebar-controls-column {
            flex: 0 0 340px;
            max-width: 380px;
            width: 100%;
        }

        @media (max-width: 1200px) {
            .editor-workspace-layout {
                flex-direction: column;
            }

            .live-preview-container-column {
                width: 100%;
                position: static;
            }

            .sidebar-controls-column {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }

        /* ANTEPRIMA INLINE NEL CORPO */
        .inline-live-preview-box {
            background-color: #080c14;
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 24px;
            min-height: 450px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        /* FIX FULLSCREEN 100% LARGHEZZA SENZA MARGINI */
        .inline-live-preview-box.fullscreen-preview {
            position: fixed;
            inset: 0;
            z-index: 9999;
            border-radius: 0;
            border: none;
            padding: 0 !important;
            margin: 0 !important;
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            overflow-y: auto;
            background-color: #080c14;
        }

        .opacity-control-wrapper {
            margin-top: 15px;
        }

        .opacity-value {
            min-width: 55px;
            text-align: center;
        }

        #bgOpacityRange,
        #itemBgOpacityRange {
            accent-color: #00dc82;
        }

        .modal-content-dark {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
        }

        .background-image-controls {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.65);
        }

        .row-preview-block {
            position: relative;
            overflow: hidden;
        }

        .row-preview-block::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--preview-background-image);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--preview-opacity, 0);
            filter: saturate(var(--preview-saturation, 1)) grayscale(var(--preview-grayscale, 0)) brightness(var(--preview-brightness, 1));
            pointer-events: none;
        }

        .row-preview-block>* {
            position: relative;
            z-index: 1;
        }

        .accordion-button:not(.collapsed) {
            background-color: #1e293b !important;
            color: #00dc82 !important;
        }

        .accordion-button {
            background-color: #0f172a !important;
            color: #cbd5e1 !important;
            box-shadow: none !important;
        }

        /* ========================================================
           RESA FEDELE ANTEPRIMA (Stile identico a index.html)
           ======================================================== */
        #rowPreviewModal .modal-body {
            background-color: #080c14 !important;
            padding: 0 !important;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .preview-block-container {
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            position: relative !important;
            width: 100% !important;
            box-sizing: border-box !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            transition: background-color 0.3s ease;
        }

        .preview-block-container.has-background-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--block-background-image);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--block-background-opacity, 1);
            filter: saturate(var(--block-background-saturation, 1)) grayscale(var(--block-background-grayscale, 0)) brightness(var(--block-background-brightness, 1));
            pointer-events: none;
            z-index: 0;
        }

        .preview-block-container.has-background-image>* {
            position: relative;
            z-index: 1;
        }

        .preview-block-container.has-fixed-height {
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }

        .preview-block-container.has-fixed-height>div {
            height: 100% !important;
        }

        .preview-marquee-container {
            overflow: hidden;
            width: 100%;
        }

        .preview-marquee-track {
            display: flex;
            width: max-content;
            animation: previewMarqueeScroll 25s linear infinite;
        }

        .preview-marquee-group {
            display: flex;
            gap: 1.5rem;
            padding-right: 1.5rem;
        }

        @keyframes previewMarqueeScroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        /* ========================================================
           FULLSCREEN ANTEPRIMA: 100% LARGHEZZA SENZA MARGINI AI LATI
           ======================================================== */
        #rowPreviewModal .modal-dialog {
            max-width: 100vw !important;
            margin: 0 !important;
        }

        #rowPreviewModal .modal-content {
            background-color: #080c14 !important;
            border: none !important;
            border-radius: 0 !important;
            min-height: 100vh;
        }

        #rowPreviewModal .modal-body {
            background-color: #080c14 !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100vw !important;
            max-width: 100vw !important;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #rowPreviewModal .preview-container,
        #rowPreviewModal #rowPreviewRenderArea,
        #inlineLivePreviewBox .preview-block-container {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
        }

        /* ========================================================
           RESA TESTO FEDELE AD INDEX.HTML (.tinymce-content)
           ======================================================== */
        .preview-block-container .tinymce-content {
            font-family: 'Neue Haas Grotesk Display Pro', Arial, Helvetica, sans-serif !important;
            font-size: 18px !important;
            line-height: 1.6 !important;
            color: #ffffff !important;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .preview-block-container .tinymce-content p {
            font-size: 18px !important;
            line-height: 1.6 !important;
            color: #ffffff !important;
            margin-bottom: 1rem;
        }

        .preview-block-container .tinymce-content h1,
        .preview-block-container .tinymce-content h2,
        .preview-block-container .tinymce-content h3,
        .preview-block-container .tinymce-content h4,
        .preview-block-container .tinymce-content h5,
        .preview-block-container .tinymce-content h6 {
            color: #ffffff !important;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .preview-block-container .tinymce-content h1:first-child,
        .preview-block-container .tinymce-content h2:first-child,
        .preview-block-container .tinymce-content p:first-child {
            margin-top: 0 !important;
        }

        .preview-block-container .tinymce-content a {
            color: #36e4da !important;
            text-decoration: underline;
        }

        .preview-block-container .tinymce-content img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }

        .preview-block-container .custom-jumbotron {
            background: transparent !important;
            border: none !important;
            color: #f1f5f9;
            box-shadow: none !important;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>

    <!-- INCLUSIONE DINAMICA DEL FRAGMENT TINYMCE -->
    <th:block th:replace="~{fragments/tinymce :: tinymce-scripts}"></th:block>

    <!-- FRAGMENT MONACO:
         contiene esclusivamente CSS, modale e script Monaco.
         Il caricamento effettivo di Monaco è lazy. -->
    <th:block th:replace="~{fragments/monaco :: monaco-css}"></th:block>

    <!-- PRELOAD E FONT UFFICIALI (Come in index.html) -->
    <link rel="preload" href="/fonts/NeueHaasDisplayRoman.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/NeueHaasDisplayBold.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        @font-face {
            font-family: 'Neue Haas Grotesk Display Pro';
            src: url('/fonts/NeueHaasDisplayRoman.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk Display Pro';
            src: url('/fonts/NeueHaasDisplayBold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
    </style>

</head>

<body>

    <canvas id="tech-bg-canvas"></canvas>

    <div class="container-fluid px-4 py-3">

        <!-- INTESTAZIONE AZIONI -->
        <div
            class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary border-opacity-25">
            <h2 class="fw-bold m-0" th:text="${block.id == null ? 'Nuova Riga' : 'Modifica Riga #' + block.id}">
                Editor Riga
            </h2>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-success px-4" onclick="showSaveBlockModal()">
                    <i class="bi bi-save me-1"></i> Salva Riga
                </button>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-light">
                    <i class="bi bi-arrow-left"></i> Torna alla Gestione Righe
                </a>
            </div>
        </div>

        <!-- FORM PRINCIPALE -->
        <form id="blockForm" th:action="@{/admin/block/save}" th:object="${block}" method="post"
            enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}" />

            <div class="editor-workspace-layout">

                <!-- COLONNA PRINCIPALE (80% LARGHEZZA): ANTEPRIMA LIVE & EDITING FRAGMENT -->
                <div class="live-preview-container-column">

                    <div class="card p-3 shadow-sm mb-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <span class="fw-bold text-info fs-5">
                                <i class="bi bi-eye me-2"></i>Anteprima Live Blocco (Pubblica)
                            </span>

                            <div class="d-flex gap-2">

                                <button type="button"
                                    class="btn btn-sm btn-outline-light"
                                    onclick="openRowPreview()">
                                    <i class="bi bi-window me-1"></i>
                                    Anteprima in Finestra
                                </button>

                            </div>

                        </div>

                        <!-- CONTENITORE ANTEPRIMA IN REAL TIME DEL BLOCCO -->
                        <div id="inlineLivePreviewBox" class="inline-live-preview-box">
                            <div id="inlineRowPreviewRenderArea"></div>
                        </div>

                    </div>

                    <!-- CHIAMATA AL FRAGMENT PER IL CONTENUTO PRINCIPALE -->
                    <div th:replace="~{fragments/blocco-editor :: bloccoEditorMain}"></div>

                </div>

                <!-- SIDEBAR DESTRA (20% LARGHEZZA): CHIAMATA AL FRAGMENT SIDEBAR -->
                <div th:replace="~{fragments/blocco-editor :: bloccoEditorSidebar}"></div>

            </div>
        </form>

        <!-- CHIAMATA AL FRAGMENT PER IL FORM CARDS / SLIDE -->
        <div th:replace="~{fragments/blocco-editor :: bloccoEditorItemForm}"></div>

    </div>

    <!-- CHIAMATA AL FRAGMENT MODALI -->
    <div th:replace="~{fragments/blocco-editor :: bloccoEditorModals}"></div>

    <!-- MODALE MONACO -->
    <div th:replace="~{fragments/monaco :: monaco-modal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CHIAMATA AL FRAGMENT SCRIPT UTILITY -->
    <th:block th:replace="~{fragments/blocco-editor :: bloccoEditorScripts}"></th:block>

    <!-- SCRIPT MONACO:
         contiene solo il codice specifico Monaco.
         Monaco viene caricato dinamicamente al click. -->
    <th:block th:replace="~{fragments/monaco :: monaco-scripts}"></th:block>

    <!-- JS DI RENDER ANTEPRIMA ED INTERFACCIA WEB -->
    <script>

        let tempBgImageBlobUrl = null;

        function openRowPreview() {
            renderRowPreview('rowPreviewRenderArea');
            const previewModal = new bootstrap.Modal(document.getElementById('rowPreviewModal'));
            previewModal.show();
        }

        function renderRowPreview(targetAreaId = 'inlineRowPreviewRenderArea') {
            const renderArea = document.getElementById(targetAreaId);
            if (!renderArea) return;

            // 1. Parametri Blocco
            const blockType = document.getElementById('blockTypeSelect')?.value || '';
            const containerType = document.getElementById('containerTypeSelect')?.value || 'CONTAINER';

            // Se in Fullscreen inline, forziamo al 100% la larghezza
            const isFullscreenBox = document.getElementById('inlineLivePreviewBox')?.classList.contains('fullscreen-preview');
            const widthPercent = (targetAreaId === 'rowPreviewRenderArea' || isFullscreenBox)
                ? 100
                : parseInt(document.getElementById('widthPercentInput')?.value || '100', 10);

            // Normalizzazione altezza
            let rawHeight = (document.getElementById('customHeightInput')?.value || '').trim();
            let customHeight = 'auto';
            let isFixedHeight = false;

            if (rawHeight && rawHeight !== 'auto') {
                if (/^\d+$/.test(rawHeight)) {
                    customHeight = rawHeight + 'px';
                } else {
                    customHeight = rawHeight;
                }
                isFixedHeight = true;
            }

            const bgColor = document.getElementById('bgColorInput')?.value || 'transparent';
            const imageUrl = document.getElementById('blockImageUrl')?.value || '';

            // 2. Immagine di sfondo effettiva
            const removeBgCheckbox = document.getElementById('removeBackgroundImage');
            const isRemovingBg = removeBgCheckbox && removeBgCheckbox.checked;

            let effectiveBgImageUrl = '';

            if (!isRemovingBg) {

                if (typeof tempBgImageBlobUrl !== 'undefined' && tempBgImageBlobUrl) {
                    effectiveBgImageUrl = tempBgImageBlobUrl;

                } else {

                    const existingUrlInput = document.getElementById('backgroundImageUrl');

                    effectiveBgImageUrl = existingUrlInput
                        ? existingUrlInput.value.trim()
                        : '';
                }
            }

            const hasBgImage = Boolean(
                effectiveBgImageUrl &&
                effectiveBgImageUrl.length > 0
            );

            const bgImageOpacity =
                parseInt(
                    document.getElementById('bgImageOpacityRange')?.value || '100',
                    10
                );

            const bgImageSaturation =
                parseInt(
                    document.getElementById('bgImageSaturationRange')?.value || '100',
                    10
                );

            const bgImageGrayscale =
                parseInt(
                    document.getElementById('bgImageGrayscaleRange')?.value || '0',
                    10
                );

            const bgImageBrightness =
                parseInt(
                    document.getElementById('bgImageBrightnessRange')?.value || '100',
                    10
                );

            // 3. Stili bordi e pulsanti
            const borderStyle =
                document.querySelector('[name="borderStyle"]')?.value || 'NONE';

            const borderColor =
                document.getElementById('borderColorInput')?.value || '#334155';

            const buttonBackgroundColor =
                document.getElementById('buttonBackgroundColorInput')?.value || '#00dc82';

            const buttonTextColor =
                document.getElementById('buttonTextColorInput')?.value || '#0f172a';

            const buttonRadiusStyle =
                document.querySelector('[name="buttonRadiusStyle"]')?.value || 'ROUNDED';

            const cardRadiusStyle =
                document.querySelector('[name="cardRadiusStyle"]')?.value || 'ROUNDED';

            const carouselRadiusStyle =
                document.querySelector('[name="carouselRadiusStyle"]')?.value || 'ROUNDED';

            const borderMap = {
                NONE: 'none',
                THIN_SOLID: `1px solid ${borderColor}`,
                MEDIUM_SOLID: `2px solid ${borderColor}`,
                THICK_SOLID: `4px solid ${borderColor}`,
                DASHED: `2px dashed ${borderColor}`,
                DOTTED: `2px dotted ${borderColor}`
            };

            const cardRadiusMap = {
                ROUNDED: '1.25rem',
                SQUARED: '0',
                TOP_ROUNDED: '1.25rem 1.25rem 0 0'
            };

            const carouselRadius =
                carouselRadiusStyle === 'SQUARED'
                    ? '0'
                    : '1.5rem';

            const buttonRadius =
                buttonRadiusStyle === 'SQUARED'
                    ? '0'
                    : '999px';

            // 4. Mappatura Container Bootstrap fedele all'index
            const containerClasses = {
                CONTAINER: 'container',
                CONTAINER_FLUID: 'container-fluid',
                CONTAINER_SM: 'container-sm',
                CONTAINER_MD: 'container-md',
                CONTAINER_LG: 'container-lg',
                CONTAINER_XL: 'container-xl',
                CONTAINER_XXL: 'container-xxl'
            };

            // In fullscreen forziamo il container fluid
            const chosenContainerClass =
                (targetAreaId === 'rowPreviewRenderArea' || isFullscreenBox)
                    ? 'container-fluid'
                    : (containerClasses[containerType] || 'container');

            // 5. Dimensioni Card & Carosello
            const cardsPerRow =
                document.querySelector('[name="cardsPerRow"]')?.value || '3';

            const cardImgHeight =
                document.getElementById('customCardImageHeightInput')?.value
                    ? document.getElementById('customCardImageHeightInput').value + 'px'
                    : (
                        document.querySelector('[name="cardImageHeight"]')?.value
                        || '280px'
                    );

            const cardMaxWidth =
                document.getElementById('customCardMaxWidthInput')?.value
                    ? document.getElementById('customCardMaxWidthInput').value + 'px'
                    : 'none';

            const cardSpacing =
                document.getElementById('cardSpacingInput')?.value || '4';

            const carouselHeight =
                document.getElementById('customCarouselHeightInput')?.value
                    ? document.getElementById('customCarouselHeightInput').value + 'px'
                    : (
                        document.querySelector('[name="carouselSlideHeight"]')?.value
                        || '500px'
                    );

            const carouselMaxWidth =
                document.getElementById('customCarouselWidthInput')?.value || '100%';

            const multiItemWidth =
                document.getElementById('customMultiWidthInput')?.value
                    || (
                        document.querySelector('[name="multiItemWidth"]')?.value
                        || '390'
                    );

            const multiItemHeight =
                document.getElementById('customMultiHeightInput')?.value
                    || Math.round(multiItemWidth * 0.66);

            // Costruzione stili del container esterno
            const blockContainerStyles = [
                `height: ${customHeight}`,
                `background-color: ${bgColor}`,
                `border: ${borderMap[borderStyle] || 'none'}`,
                hasBgImage
                    ? `--block-background-image: url('${effectiveBgImageUrl}')`
                    : '',
                `--block-background-opacity: ${hasBgImage ? (bgImageOpacity / 100) : 0}`,
                `--block-background-saturation: ${bgImageSaturation / 100}`,
                `--block-background-grayscale: ${bgImageGrayscale / 100}`,
                `--block-background-brightness: ${bgImageBrightness / 100}`
            ]
                .filter(Boolean)
                .join('; ');

            const innerWidthStyle = `width: ${widthPercent}%;`;

            let htmlOutput = `
        <div class="${chosenContainerClass} py-3 preview-block-container position-relative ${hasBgImage ? 'has-background-image' : ''} ${isFixedHeight ? 'has-fixed-height' : ''}" 
             style="${blockContainerStyles}">`;

            // -------------------------------------------------------------
            // CARDS
            // -------------------------------------------------------------
            if (blockType === 'CARDS') {

                const colClass =
                    cardsPerRow == '2'
                        ? 'col-12 col-md-6 col-lg-6'
                        : (
                            cardsPerRow == '4'
                                ? 'col-12 col-md-6 col-lg-3'
                                : 'col-12 col-md-6 col-lg-4'
                        );

                const cards =
                    document.querySelectorAll('.existing-item-card');

                htmlOutput +=
                    `<div class="mx-auto w-100" style="${innerWidthStyle}">`;

                htmlOutput +=
                    `<div class="row g-${cardSpacing} justify-content-between align-items-stretch">`;

                if (cards.length === 0) {

                    htmlOutput += `
                    <div class="col-12 text-center text-muted py-5">
                        <i class="bi bi-grid-3x3-gap fs-1 d-block mb-2 text-success"></i>
                        Nessuna Card inserita finora.
                    </div>`;

                } else {

                    cards.forEach(card => {

                        const title =
                            card.querySelector('.item-title-target')?.innerHTML
                            || 'Titolo Card';

                        const subtitle =
                            card.querySelector('.item-subtitle-target')?.innerHTML
                            || '';

                        const content =
                            card.querySelector('.item-content-target')?.innerHTML
                            || '';

                        const img =
                            card.querySelector('.item-img-target')?.getAttribute('src')
                            || '';

                        const btn =
                            card.querySelector('.item-btn-target');

                        let cardBgColor =
                            card.getAttribute('data-card-bg')
                            || card.style.backgroundColor
                            || card.querySelector('[data-card-bg]')?.getAttribute('data-card-bg')
                            || '#0f172a';

                        htmlOutput += `
                    <div class="${colClass} d-flex">
                        <div class="card card-custom w-100 d-flex flex-column overflow-hidden shadow border-0 text-white" 
                             style="background-color: ${cardBgColor} !important; border-radius:${cardRadiusMap[cardRadiusStyle] || '1.25rem'}; max-width: ${cardMaxWidth};">

                            ${img ? `
                            <div class="card-img-wrapper" style="overflow:hidden; border-radius:${cardRadiusStyle === 'SQUARED' ? '0' : '1.25rem 1.25rem 0 0'};">
                                <img src="${img}"
                                     class="card-img-top card-img-responsive"
                                     style="height:${cardImgHeight}; object-fit:cover; width:100%;">
                            </div>` : ''}

                            <div class="card-body p-4 d-flex flex-column">

                                <h4 class="card-title fw-bold mb-2 text-white">
                                    ${title}
                                </h4>

                                ${subtitle ? `
                                <h6 class="card-subtitle mb-3 text-success opacity-75 fw-semibold">
                                    ${subtitle}
                                </h6>` : ''}

                                <div class="card-text flex-grow-1 text-light opacity-75 small">
                                    ${content}
                                </div>

                                ${btn ? `
                                <div class="mt-4 pt-2">
                                    <span class="btn btn-sm px-4 py-2 fw-semibold"
                                          style="background:${buttonBackgroundColor};
                                                 border-color:${buttonBackgroundColor};
                                                 color:${buttonTextColor};
                                                 border-radius:${buttonRadius};">
                                        ${btn.innerText}
                                        <i class="bi bi-arrow-right ms-1"></i>
                                    </span>
                                </div>` : ''}

                            </div>
                        </div>
                    </div>`;
                    });
                }

                htmlOutput += `</div></div>`;

            // -------------------------------------------------------------
            // CAROUSEL
            // -------------------------------------------------------------
            } else if (blockType === 'CAROUSEL') {

                const isMulti =
                    document.getElementById("carouselTypeMulti")?.checked;

                const slides =
                    document.querySelectorAll('.existing-item-card');

                if (isMulti) {

                    htmlOutput += `
                    <div class="preview-marquee-container py-3 mx-auto"
                         style="${innerWidthStyle}">`;

                    if (slides.length === 0) {

                        htmlOutput += `
                        <div class="text-center text-muted w-100 py-4">
                            <i class="bi bi-images fs-1 d-block mb-2 text-info"></i>
                            Nessuna immagine nel nastro.
                        </div>`;

                    } else {

                        let itemsMarkup = '';

                        slides.forEach(slide => {

                            const img =
                                slide.querySelector('.item-img-target')
                                    ?.getAttribute('src') || '';

                            itemsMarkup += `
                        <div class="flex-shrink-0 rounded-4 overflow-hidden shadow"
                             style="width: ${multiItemWidth}px; height: ${multiItemHeight}px;">

                            ${img
                                    ? `<img src="${img}"
                                            style="width:100%; height:100%; object-fit:cover;">`
                                    : `<div class="h-100 bg-secondary d-flex align-items-center justify-content-center text-muted">
                                            <i class="bi bi-image fs-1"></i>
                                       </div>`
                                }

                        </div>`;
                        });

                        htmlOutput += `
                    <div class="preview-marquee-track">
                        <div class="preview-marquee-group">
                            ${itemsMarkup}
                        </div>

                        <div class="preview-marquee-group" aria-hidden="true">
                            ${itemsMarkup}
                        </div>
                    </div>`;
                    }

                    htmlOutput += `</div>`;

                } else {

                    htmlOutput += `
                    <div class="carousel slide rounded overflow-hidden mx-auto shadow position-relative"
                         style="max-width: ${carouselMaxWidth};
                                border-radius: ${carouselRadius};
                                ${innerWidthStyle}">`;

                    if (slides.length === 0) {

                        htmlOutput += `
                        <div class="text-center text-muted py-5"
                             style="height:${carouselHeight};
                                    background:rgba(0,0,0,0.3);
                                    display:flex;
                                    flex-direction:column;
                                    justify-content:center;
                                    align-items:center;">

                            <i class="bi bi-aspect-ratio fs-1 mb-2 text-success"></i>
                            Nessuna slide inserita nel carosello Hero.

                        </div>`;

                    } else {

                        const firstSlide = slides[0];

                        const title =
                            firstSlide.querySelector('.item-title-target')?.innerHTML
                            || 'Titolo Slide';

                        const content =
                            firstSlide.querySelector('.item-content-target')?.innerHTML
                            || '';

                        const img =
                            firstSlide.querySelector('.item-img-target')?.getAttribute('src')
                            || 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80';

                        const btn =
                            firstSlide.querySelector('.item-btn-target');

                        htmlOutput += `
                    <div class="position-relative"
                         style="height:${carouselHeight};">

                        <img src="${img}"
                             style="width:100%; height:100%; object-fit:cover;">

                        <div class="position-absolute bottom-0 start-0 p-4 w-100"
                             style="background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);">

                            <h2 class="fw-bold text-white mb-2">
                                ${title}
                            </h2>

                            <div class="text-light opacity-90 small mb-3">
                                ${content}
                            </div>

                            ${btn ? `
                            <span class="btn px-4 py-2 fw-semibold"
                                  style="background:${buttonBackgroundColor};
                                         border-color:${buttonBackgroundColor};
                                         color:${buttonTextColor};
                                         border-radius:${buttonRadius};">
                                ${btn.innerText}
                                <i class="bi bi-arrow-right ms-1"></i>
                            </span>` : ''}

                        </div>
                    </div>`;
                    }

                    htmlOutput += `</div>`;
                }

            // -------------------------------------------------------------
            // JUMBOTRON / CONTENUTO TESTUALE
            // -------------------------------------------------------------
            } else {

                let contentHtml =
                    (window.tinymce && tinymce.get('mainContentHtml'))
                        ? tinymce.get('mainContentHtml').getContent()
                        : (document.getElementById('mainContentHtml')?.value || '');

                htmlOutput += `
            <div class="p-4 p-md-5 custom-jumbotron mx-auto"
                 style="${innerWidthStyle}">

                ${imageUrl ? `
                <div class="text-center mb-4">
                    <img src="${imageUrl}"
                         class="img-fluid rounded"
                         style="max-height: 350px;">
                </div>` : ''}

                <div class="container-fluid py-2 tinymce-content">
                    ${contentHtml
                        || '<span class="text-muted fst-italic">Nessun contenuto inserito nell\'editor.</span>'
                    }
                </div>

            </div>`;
            }

            htmlOutput += `</div>`;

            renderArea.innerHTML = htmlOutput;
        }

        function renderRowPreviewIfOpen() {

            renderRowPreview('inlineRowPreviewRenderArea');

            const modalEl =
                document.getElementById('rowPreviewModal');

            if (modalEl && modalEl.classList.contains('show')) {
                renderRowPreview('rowPreviewRenderArea');
            }
        }

        function showSaveBlockModal() {

            const modal =
                new bootstrap.Modal(
                    document.getElementById('saveBlockModal')
                );

            modal.show();
        }

        function showSaveItemModal() {

            const modal =
                new bootstrap.Modal(
                    document.getElementById('saveItemModal')
                );

            modal.show();
        }

        function confirmDeleteItem(deleteUrl) {

            document.getElementById('btnConfirmDeleteItem').href =
                deleteUrl;

            const modal =
                new bootstrap.Modal(
                    document.getElementById('deleteItemModal')
                );

            modal.show();
        }

        document.addEventListener("DOMContentLoaded", function () {

            const blockTypeSelect =
                document.getElementById("blockTypeSelect");

            const mainImageUpload =
                document.getElementById("mainImageUpload");

            const mainEditorSection =
                document.getElementById("mainEditorSection");

            const itemsSection =
                document.getElementById("itemsSection");

            const itemFormContainerSection =
                document.getElementById("itemFormContainerSection");

            const itemsSectionTitle =
                document.getElementById("itemsSectionTitle");

            const itemsSectionDescription =
                document.getElementById("itemsSectionDescription");

            const addItemTitle =
                document.getElementById("addItemTitle");

            const itemTitleLabel =
                document.getElementById("itemTitleLabel");

            const itemImageLabel =
                document.getElementById("itemImageLabel");

            const addItemButtonText =
                document.getElementById("addItemButtonText");

            const existingItemsTitle =
                document.getElementById("existingItemsTitle");

            const carouselTypeWrapper =
                document.getElementById("carouselTypeWrapper");

            const cardsDimensionsWrapper =
                document.getElementById("cardsDimensionsWrapper");

            const carouselDimensionsWrapper =
                document.getElementById("carouselDimensionsWrapper");

            const standardHeightOption =
                document.getElementById("standardHeightOption");

            const multiWidthOption =
                document.getElementById("multiWidthOption");

            if (typeof initBgColor === 'function')
                initBgColor();

            if (typeof initItemBgColor === 'function')
                initItemBgColor();

            updateBackgroundColorControls();
            updateBackgroundImageControls();

            const carouselRadios =
                document.querySelectorAll(
                    'input[name="carouselType"]'
                );

            carouselRadios.forEach(radio =>
                radio.addEventListener(
                    "change",
                    aggiornaInterfaccia
                )
            );

            if (blockTypeSelect) {

                blockTypeSelect.addEventListener(
                    "change",
                    aggiornaInterfaccia
                );

                aggiornaInterfaccia();
            }

            function aggiornaInterfaccia() {

                const tipo =
                    blockTypeSelect
                        ? blockTypeSelect.value
                        : "";

                const isCards =
                    tipo === "CARDS";

                const isCarousel =
                    tipo === "CAROUSEL";

                const isMultiCarousel =
                    isCarousel &&
                    (
                        document.getElementById("carouselTypeMulti")?.checked
                        || false
                    );

                const cardCarouselAppearanceWrapper =
                    document.getElementById(
                        "cardCarouselAppearanceWrapper"
                    );

                const cardRadiusOption =
                    document.getElementById(
                        "cardRadiusOption"
                    );

                const carouselRadiusOption =
                    document.getElementById(
                        "carouselRadiusOption"
                    );

                if (cardCarouselAppearanceWrapper)
                    cardCarouselAppearanceWrapper.style.display =
                        (isCards || isCarousel)
                            ? ""
                            : "none";

                if (cardRadiusOption)
                    cardRadiusOption.style.display =
                        isCards
                            ? ""
                            : "none";

                if (carouselRadiusOption)
                    carouselRadiusOption.style.display =
                        isCarousel
                            ? ""
                            : "none";

                if (carouselTypeWrapper)
                    carouselTypeWrapper.style.display =
                        isCarousel
                            ? ""
                            : "none";

                if (cardsDimensionsWrapper)
                    cardsDimensionsWrapper.style.display =
                        isCards
                            ? ""
                            : "none";

                if (carouselDimensionsWrapper)
                    carouselDimensionsWrapper.style.display =
                        isCarousel
                            ? ""
                            : "none";

                if (standardHeightOption)
                    standardHeightOption.style.display =
                        (isCarousel && !isMultiCarousel)
                            ? ""
                            : "none";

                if (multiWidthOption)
                    multiWidthOption.style.display =
                        isMultiCarousel
                            ? ""
                            : "none";

                const customDimensionsWrapper =
                    document.getElementById(
                        "customDimensionsWrapper"
                    );

                if (customDimensionsWrapper)
                    customDimensionsWrapper.style.display =
                        (isCards || isCarousel)
                            ? ""
                            : "none";

                document
                    .querySelectorAll(".custom-card-dim")
                    .forEach(el =>
                        el.style.display =
                            isCards
                                ? ""
                                : "none"
                    );

                document
                    .querySelectorAll(".custom-standard-carousel")
                    .forEach(el =>
                        el.style.display =
                            (isCarousel && !isMultiCarousel)
                                ? ""
                                : "none"
                    );

                document
                    .querySelectorAll(".custom-multi-carousel")
                    .forEach(el =>
                        el.style.display =
                            isMultiCarousel
                                ? ""
                                : "none"
                    );

                const mostraImmaginePrincipale =
                    tipo === "JUMBO_DEMO_1"
                    || tipo === "JUMBO_DEMO_2";

                if (mainImageUpload)
                    mainImageUpload.style.display =
                        mostraImmaginePrincipale
                            ? ""
                            : "none";

                const isItemsBlock =
                    isCards || isCarousel;

                if (mainEditorSection)
                    mainEditorSection.style.display =
                        isItemsBlock
                            ? "none"
                            : "";

                if (itemsSection)
                    itemsSection.style.display =
                        isItemsBlock
                            ? ""
                            : "none";

                if (itemFormContainerSection)
                    itemFormContainerSection.style.display =
                        isItemsBlock
                            ? ""
                            : "none";

                if (isCards) {

                    if (itemsSectionTitle)
                        itemsSectionTitle.textContent =
                            "Gestione Griglia Cards";

                    if (itemsSectionDescription)
                        itemsSectionDescription.textContent =
                            "Gestisci le Card che compongono questa riga.";

                    if (
                        addItemTitle
                        && (
                            !editingMode()
                            || addItemTitle.textContent.trim()
                                !== "Modifica Elemento"
                        )
                    )
                        addItemTitle.textContent =
                            "Aggiungi Card";

                    if (itemTitleLabel)
                        itemTitleLabel.textContent =
                            "Titolo Card";

                    if (itemImageLabel)
                        itemImageLabel.textContent =
                            "Carica Immagine Card";

                    if (
                        addItemButtonText
                        && !editingMode()
                    )
                        addItemButtonText.textContent =
                            "Salva Card";

                    if (existingItemsTitle)
                        existingItemsTitle.textContent =
                            "Card Esistenti";
                }

                if (isCarousel) {

                    if (itemsSectionTitle)
                        itemsSectionTitle.textContent =
                            "Gestione Slide Carosello";

                    if (itemsSectionDescription)
                        itemsSectionDescription.textContent =
                            "Gestisci le immagini e i testi che scorreranno.";

                    if (
                        addItemTitle
                        && (
                            !editingMode()
                            || addItemTitle.textContent.trim()
                                !== "Modifica Elemento"
                        )
                    )
                        addItemTitle.textContent =
                            "Aggiungi Slide";

                    if (itemTitleLabel)
                        itemTitleLabel.textContent =
                            "Titolo Slide";

                    if (itemImageLabel)
                        itemImageLabel.textContent =
                            "Carica Immagine Slide";

                    if (
                        addItemButtonText
                        && !editingMode()
                    )
                        addItemButtonText.textContent =
                            "Salva Slide";

                    if (existingItemsTitle)
                        existingItemsTitle.textContent =
                            "Slide Esistenti";
                }

                const itemTitleCol =
                    document.getElementById("itemTitleCol");

                const itemTitleInput =
                    document.getElementById("itemTitleInput");

                const itemImageCol =
                    document.getElementById("itemImageCol");

                const itemExtraFields =
                    document.getElementById("itemExtraFields");

                if (isMultiCarousel) {

                    if (itemTitleCol)
                        itemTitleCol.style.display = "none";

                    if (itemExtraFields)
                        itemExtraFields.style.display = "none";

                    if (itemImageCol)
                        itemImageCol.className = "col-12";

                    if (itemImageLabel)
                        itemImageLabel.textContent =
                            "Carica Immagine Nastro";

                    if (itemTitleInput)
                        itemTitleInput.required = false;

                } else {

                    if (itemTitleCol)
                        itemTitleCol.style.display = "";

                    if (itemExtraFields)
                        itemExtraFields.style.display = "";

                    if (itemImageCol)
                        itemImageCol.className = "col-md-6";

                    if (itemTitleInput)
                        itemTitleInput.required = true;
                }

                renderRowPreviewIfOpen();
            }

            document
                .querySelectorAll('input, select, textarea')
                .forEach(el => {

                    el.addEventListener(
                        'input',
                        renderRowPreviewIfOpen
                    );

                    el.addEventListener(
                        'change',
                        renderRowPreviewIfOpen
                    );
                });

            function editingMode() {

                const button =
                    document.getElementById(
                        "addItemButtonText"
                    );

                return button
                    ? button.textContent.trim()
                        === "Salva Modifiche Elemento"
                    : false;
            }

            renderRowPreviewIfOpen();
        });

        function updateBackgroundColorControls() {

            const bgInput =
                document.getElementById("bgColorInput");

            const bgPicker =
                document.getElementById("bgPicker");

            const transparentSwitch =
                document.getElementById("isTransparentSwitch");

            const opacityRange =
                document.getElementById("bgOpacityRange");

            const backgroundImageUrl =
                document.getElementById("backgroundImageUrl");

            const removeBackgroundImage =
                document.getElementById("removeBackgroundImage");

            const backgroundImageFile =
                document.getElementById("backgroundImageFile");

            const hasExistingBackgroundImage =
                backgroundImageUrl
                && backgroundImageUrl.value.trim() !== "";

            const hasNewBackgroundImage =
                backgroundImageFile
                && backgroundImageFile.files
                && backgroundImageFile.files.length > 0;

            const removingBackgroundImage =
                removeBackgroundImage
                && removeBackgroundImage.checked;

            const backgroundImageActive =
                !removingBackgroundImage
                && (
                    hasExistingBackgroundImage
                    || hasNewBackgroundImage
                );

            if (backgroundImageActive) {

                if (bgInput)
                    bgInput.readOnly = true;

                if (bgPicker)
                    bgPicker.disabled = true;

                if (transparentSwitch)
                    transparentSwitch.disabled = true;

                if (opacityRange)
                    opacityRange.disabled = true;

                return;
            }

            if (bgInput) {
                bgInput.disabled = false;
                bgInput.readOnly = false;
            }

            if (bgPicker)
                bgPicker.disabled = false;

            if (transparentSwitch)
                transparentSwitch.disabled = false;

            if (opacityRange)
                opacityRange.disabled = false;
        }

        function handleBackgroundImageSelection(input) {

            const preview =
                document.getElementById(
                    "newBackgroundImagePreview"
                );

            const previewImg =
                document.getElementById(
                    "newBackgroundImagePreviewImg"
                );

            if (
                input
                && input.files
                && input.files.length > 0
            ) {

                const file =
                    input.files[0];

                if (tempBgImageBlobUrl) {
                    URL.revokeObjectURL(
                        tempBgImageBlobUrl
                    );
                }

                tempBgImageBlobUrl =
                    URL.createObjectURL(file);

                if (previewImg)
                    previewImg.src =
                        tempBgImageBlobUrl;

                if (preview)
                    preview.style.display = "";

                const removeBackgroundImage =
                    document.getElementById(
                        "removeBackgroundImage"
                    );

                if (removeBackgroundImage)
                    removeBackgroundImage.checked =
                        false;

                const currentPreview =
                    document.getElementById(
                        "currentBackgroundImagePreview"
                    );

                if (currentPreview) {
                    currentPreview.style.opacity = "1";
                    currentPreview.style.filter = "none";
                }

            } else {

                if (tempBgImageBlobUrl) {

                    URL.revokeObjectURL(
                        tempBgImageBlobUrl
                    );

                    tempBgImageBlobUrl = null;
                }

                if (preview)
                    preview.style.display = "none";

                if (previewImg)
                    previewImg.src = "";
            }

            updateBackgroundColorControls();
            updateBackgroundImageControls();
            renderRowPreviewIfOpen();
        }

        function clearSelectedBackgroundImage() {

            const fileInput =
                document.getElementById(
                    "backgroundImageFile"
                );

            if (fileInput)
                fileInput.value = "";

            if (tempBgImageBlobUrl) {

                URL.revokeObjectURL(
                    tempBgImageBlobUrl
                );

                tempBgImageBlobUrl = null;
            }

            const preview =
                document.getElementById(
                    "newBackgroundImagePreview"
                );

            if (preview)
                preview.style.display = "none";

            const previewImg =
                document.getElementById(
                    "newBackgroundImagePreviewImg"
                );

            if (previewImg)
                previewImg.src = "";

            updateBackgroundColorControls();
            updateBackgroundImageControls();
            renderRowPreviewIfOpen();
        }

        function toggleBackgroundImageRemoval() {

            const removeBackgroundImage =
                document.getElementById(
                    "removeBackgroundImage"
                );

            const backgroundImageFile =
                document.getElementById(
                    "backgroundImageFile"
                );

            const currentPreview =
                document.getElementById(
                    "currentBackgroundImagePreview"
                );

            if (
                removeBackgroundImage
                && removeBackgroundImage.checked
            ) {

                if (backgroundImageFile)
                    backgroundImageFile.value = "";

                if (tempBgImageBlobUrl) {

                    URL.revokeObjectURL(
                        tempBgImageBlobUrl
                    );

                    tempBgImageBlobUrl = null;
                }

                const preview =
                    document.getElementById(
                        "newBackgroundImagePreview"
                    );

                if (preview)
                    preview.style.display = "none";

                if (currentPreview) {
                    currentPreview.style.opacity = "0.3";
                    currentPreview.style.filter =
                        "grayscale(100%)";
                }

            } else {

                if (currentPreview) {
                    currentPreview.style.opacity = "1";
                    currentPreview.style.filter = "none";
                }
            }

            updateBackgroundColorControls();
            updateBackgroundImageControls();
            renderRowPreviewIfOpen();
        }

        function updateBackgroundImageControls() {

            const fileInput =
                document.getElementById(
                    "backgroundImageFile"
                );

            const existingUrlInput =
                document.getElementById(
                    "backgroundImageUrl"
                );

            const controls =
                document.getElementById(
                    "backgroundImageControls"
                );

            const opacityRange =
                document.getElementById(
                    "bgImageOpacityRange"
                );

            const saturationRange =
                document.getElementById(
                    "bgImageSaturationRange"
                );

            const grayscaleRange =
                document.getElementById(
                    "bgImageGrayscaleRange"
                );

            const brightnessRange =
                document.getElementById(
                    "bgImageBrightnessRange"
                );

            const opacityValue =
                document.getElementById(
                    "bgImageOpacityValue"
                );

            const saturationValue =
                document.getElementById(
                    "bgImageSaturationValue"
                );

            const grayscaleValue =
                document.getElementById(
                    "bgImageGrayscaleValue"
                );

            const brightnessValue =
                document.getElementById(
                    "bgImageBrightnessValue"
                );

            const hasNewFile =
                fileInput
                && fileInput.files
                && fileInput.files.length > 0;

            const existingUrl =
                existingUrlInput
                    ? existingUrlInput.value.trim()
                    : "";

            const removeImageInput =
                document.getElementById(
                    "removeBackgroundImage"
                );

            const removingImage =
                removeImageInput
                && removeImageInput.checked;

            const hasImage =
                !removingImage
                && (
                    hasNewFile
                    || existingUrl !== ""
                );

            if (controls)
                controls.style.display =
                    hasImage
                        ? ""
                        : "none";

            const opacity =
                opacityRange
                    ? parseInt(
                        opacityRange.value || "100",
                        10
                    )
                    : 100;

            const saturation =
                saturationRange
                    ? parseInt(
                        saturationRange.value || "100",
                        10
                    )
                    : 100;

            const grayscale =
                grayscaleRange
                    ? parseInt(
                        grayscaleRange.value || "0",
                        10
                    )
                    : 0;

            const brightness =
                brightnessRange
                    ? parseInt(
                        brightnessRange.value || "100",
                        10
                    )
                    : 100;

            if (opacityValue)
                opacityValue.textContent =
                    opacity + "%";

            if (saturationValue)
                saturationValue.textContent =
                    saturation + "%";

            if (grayscaleValue)
                grayscaleValue.textContent =
                    grayscale + "%";

            if (brightnessValue)
                brightnessValue.textContent =
                    brightness + "%";

            renderRowPreviewIfOpen();
        }

        function resetBackgroundImageControls() {

            const opacityRange =
                document.getElementById(
                    "bgImageOpacityRange"
                );

            const saturationRange =
                document.getElementById(
                    "bgImageSaturationRange"
                );

            const grayscaleRange =
                document.getElementById(
                    "bgImageGrayscaleRange"
                );

            const brightnessRange =
                document.getElementById(
                    "bgImageBrightnessRange"
                );

            if (opacityRange)
                opacityRange.value = 100;

            if (saturationRange)
                saturationRange.value = 100;

            if (grayscaleRange)
                grayscaleRange.value = 0;

            if (brightnessRange)
                brightnessRange.value = 100;

            updateBackgroundImageControls();
        }

        function initBgColor() {

            const bgInput =
                document.getElementById(
                    "bgColorInput"
                );

            const bgPicker =
                document.getElementById(
                    "bgPicker"
                );

            const transparentSwitch =
                document.getElementById(
                    "isTransparentSwitch"
                );

            const opacityRange =
                document.getElementById(
                    "bgOpacityRange"
                );

            const opacityValue =
                document.getElementById(
                    "bgOpacityValue"
                );

            if (!bgInput)
                return;

            let value =
                bgInput.value.trim();

            if (value === "transparent") {

                if (transparentSwitch)
                    transparentSwitch.checked = true;

                if (bgPicker)
                    bgPicker.disabled = true;

                if (bgInput)
                    bgInput.readOnly = true;

                if (opacityRange)
                    opacityRange.value = 0;

                if (opacityValue)
                    opacityValue.textContent = "0%";

                return;
            }

            if (/^#[0-9A-Fa-f]{6}$/.test(value)) {

                if (bgPicker)
                    bgPicker.value = value;

                if (opacityRange)
                    opacityRange.value = 100;

                if (opacityValue)
                    opacityValue.textContent = "100%";
            }
        }

    </script>
